<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>이탈리아 가족여행 · 편집 가능한 일정표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
<style>
:root{
  --bg:#FBFBFA; --card:#FFF; --ink:#1F1F1E; --t2:#5F5E5B; --t3:#8E8D89;
  --line:#EBEAE7; --line2:#DDDCD8; --hover:#F4F3F1;
  --blue:#2F6FA8; --blueBg:#EAF3F9; --red:#B34A42; --redBg:#FBEEEC;
  --amber:#A9761C; --amberBg:#FCF3E0; --green:#3D7A55; --greenBg:#EBF4EE;
  --f:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --pad:18px; --nav:74px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;
     line-height:1.72;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;
     padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 20px)}
a{color:inherit;text-decoration:none}
.wrap{width:100%;margin:0 auto;padding:0 var(--pad)}
@media(min-width:600px){:root{--pad:26px}}
@media(min-width:768px){:root{--pad:32px} body{font-size:17px} .wrap{max-width:780px}}
@media(min-width:1024px){.wrap{max-width:920px}}
@media(min-width:1440px){:root{--pad:40px} .wrap{max-width:1060px}}

/* ── 상단 바 ── */
.top{position:sticky;top:0;z-index:50;background:rgba(251,251,250,.95);
     backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:8px;padding:10px 0}
.top .tt{flex:1;min-width:0;font-size:15px;font-weight:800;letter-spacing:-.02em;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgl{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
     border:1px solid var(--line2);background:var(--card);font-family:var(--f);
     font-size:13px;font-weight:700;color:var(--t2);cursor:pointer;white-space:nowrap}
.tgl.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.icb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--card);
     cursor:pointer;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center}
.icb:active{background:var(--hover)}

nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);
    backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;font-family:var(--f);cursor:pointer;
    padding:9px 1px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
    font-size:10.5px;font-weight:600;color:var(--t3);letter-spacing:-.03em}
nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--ink)} nav button.on svg{stroke-width:2.1}
section[data-p]{display:none;padding-top:22px}
section[data-p].on{display:block}

h2{font-size:19px;font-weight:800;letter-spacing:-.025em;margin:30px 0 12px;
   display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h2:first-child{margin-top:0}
.lead{color:var(--t2);font-size:14.5px;margin:0 0 16px;line-height:1.65}

.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.co{display:flex;gap:11px;padding:14px 15px;border-radius:11px;background:var(--hover);
    font-size:14.5px;line-height:1.68;margin:14px 0;position:relative}
.co .i{flex:0 0 20px;font-size:17px;line-height:1.35}
.co .c{flex:1;min-width:0}
.co b{font-weight:700}
.co.r{background:var(--redBg);color:#6E2E28} .co.r b{color:#5A241F}
.co.a{background:var(--amberBg);color:#6B4A11} .co.a b{color:#553A0B}
.co.b{background:var(--blueBg);color:#1E4A70} .co.b b{color:#173A58}
.co.g{background:var(--greenBg);color:#2A5539} .co.g b{color:#20422C}

/* ── 날짜 카드 ── */
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;
     margin-bottom:10px;overflow:hidden;transition:box-shadow .18s,border-color .18s}
.day[open]{border-color:var(--line2);box-shadow:0 6px 22px rgba(31,31,30,.07)}
.day summary{list-style:none;cursor:pointer;display:flex;gap:12px;align-items:center;padding:16px}
.day summary::-webkit-details-marker{display:none}
.dbadge{flex:0 0 54px;text-align:center;padding:8px 0;border-radius:10px;background:var(--hover)}
.dbadge .n{font-size:19px;font-weight:800;line-height:1.1;letter-spacing:-.03em}
.dbadge .w{font-size:11px;font-weight:600;opacity:.72;margin-top:1px}
.dtx{flex:1;min-width:0}
.dtx .city{font-size:11.5px;font-weight:700;color:var(--t3);margin-bottom:3px;
           display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.dtx .ttl{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.dtx .sub{font-size:13.5px;color:var(--t2);margin-top:3px;overflow:hidden;
          text-overflow:ellipsis;white-space:nowrap}
.chev{flex:0 0 16px;color:var(--t3);font-size:13px;transition:transform .18s}
.day[open] .chev{transform:rotate(90deg)}
.dbody{padding:16px;border-top:1px solid var(--line)}
.cchip{display:inline-block;padding:1px 8px;border-radius:100px;font-size:10.5px;
       font-weight:700;letter-spacing:0}

/* ── 타임라인 ── */
.tl{list-style:none;margin:12px 0 0;padding:0}
.tl li.it{display:flex;gap:10px;padding:9px 0;align-items:flex-start}
.tl li.it.off{opacity:.42}
.tm{flex:0 0 64px;padding-top:1px}
.tm input{width:100%;font-family:var(--f);font-size:12.5px;font-weight:700;color:var(--t3);
   border:1px solid transparent;background:none;border-radius:7px;padding:2px 3px;
   font-variant-numeric:tabular-nums;text-align:left;min-width:0}
.tm input:hover{border-color:var(--line2);background:var(--card)}
.tm input:focus{outline:none;border-color:var(--blue);background:#fff;color:var(--ink)}
.tm input::-webkit-calendar-picker-indicator{opacity:.3;width:12px;margin-left:-2px}
.tx{flex:1;min-width:0;font-size:15.5px;line-height:1.6}
.tx .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kico{flex:0 0 auto;font-size:14px;line-height:1.5}
.knm{font-size:11px;font-weight:700;color:var(--t3);letter-spacing:-.02em;
     background:var(--hover);border-radius:100px;padding:0 7px;line-height:18px;flex:0 0 auto}
.tx .nm{font-weight:600}
.tx .d{display:block;color:var(--t2);font-size:13.5px;margin-top:4px;line-height:1.6}
.mchip{display:inline-block;padding:1px 7px;border-radius:100px;
       font-size:11px;font-weight:700;background:var(--blueBg);color:var(--blue)}
.refsel{font-family:var(--f);font-size:14.5px;font-weight:600;color:var(--ink);
   border:1px solid transparent;background:none;border-radius:8px;padding:1px 4px;
   max-width:100%;cursor:pointer;letter-spacing:-.015em}
.refsel:hover{border-color:var(--line2);background:var(--card)}
.refsel:focus{outline:none;border-color:var(--blue);background:#fff}
.refsel.empty{color:var(--t3);font-weight:500}
.refln{font-size:12px;font-weight:700;color:var(--blue);white-space:nowrap}

/* 행 사이 ＋ 버튼 */
.gap{display:flex;align-items:center;gap:6px;height:20px}
.gap .ln{flex:1;display:block;height:1px;background:var(--line);opacity:.8}
.gapb{flex:0 0 auto;width:21px;height:21px;border-radius:50%;border:1px dashed var(--line2);
  background:var(--card);color:var(--t3);font-family:var(--f);font-size:12px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;transition:.14s}
.gapb:hover{border-style:solid;border-color:var(--ink);color:var(--ink);transform:scale(1.15)}

.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.lk{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;
    border:1px solid var(--line2);font-size:14px;font-weight:600;background:var(--card);cursor:pointer;
    font-family:var(--f);color:var(--ink)}
.lk.f{background:var(--ink);color:#fff;border-color:var(--ink)}
.lk.sm{padding:6px 11px;font-size:13px;border-radius:9px}

.map{width:100%;height:240px;border-radius:11px;overflow:hidden;background:var(--hover);border:1px solid var(--line)}
@media(min-width:768px){.map{height:320px}}
.rs{display:flex;flex-wrap:wrap;align-items:center;margin-top:11px;font-size:12.5px;color:var(--t2);line-height:2}
.rs .ri{display:inline-flex;align-items:center;white-space:nowrap}
.pn{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;
    border-radius:7px;background:var(--blue);color:#fff;font-size:11px;font-weight:800;
    margin-right:7px;vertical-align:2px;flex:0 0 auto}
.pn.s{background:var(--green)} .pn.e{background:var(--red)}
.rs .pn{width:17px;height:17px;font-size:10px;border-radius:6px;margin-right:4px}
.rs .ar{color:var(--t3);margin:0 5px}
.mnum{width:23px;height:23px;border-radius:8px;color:#fff;border:2px solid #fff;
      font-family:var(--f);font-size:11px;font-weight:800;line-height:19px;text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,.28)}
.mlbl{font-family:var(--f);font-size:11px;font-weight:600;color:var(--ink);
      background:rgba(255,255,255,.96);padding:2px 7px;border-radius:6px;border:1px solid var(--line2);white-space:nowrap}
.leaflet-container{font-family:var(--f)}

/* ── 숙소 ── */
.stay{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;
      overflow:hidden;margin-bottom:12px;align-items:stretch}
.stay .im{flex:0 0 118px;position:relative;background:var(--hover)}
.stay .im::before{content:"";display:block;padding-top:100%}
.stay .im .tile{position:absolute;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:5px;color:#fff}
.stay .im .tile .e{font-size:24px}
.stay .im .tile .l{font-size:10px;font-weight:700;letter-spacing:.08em}
.stay .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.stay .bd{flex:1;min-width:0;padding:15px 16px}
.stay .city{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--t3)}
.stay .nm{font-size:16.5px;font-weight:700;letter-spacing:-.02em;line-height:1.35;margin:2px 0 4px}
.stay .dt{font-size:13px;color:var(--t2)}
.stay .ds{font-size:13.5px;color:var(--t2);margin-top:7px;line-height:1.55}
@media(min-width:600px){.stay .im{flex:0 0 168px}.stay .bd{padding:18px 20px}}

/* ── 카드 그리드(식당·관광지) ── */
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1024px){.grid{grid-template-columns:1fr 1fr 1fr}}
.ec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;display:block;position:relative}
.ec .n{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.ec .g{font-size:13px;color:var(--t2);margin-top:3px}
.ec .f{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ec .d{font-size:13.5px;color:var(--t2);margin-top:8px;line-height:1.6}
.ec .used{font-size:12px;color:var(--blue);font-weight:700;margin-top:8px;line-height:1.5}
.flag{display:inline-block;padding:1px 8px;border-radius:100px;font-size:11px;font-weight:700}
.flag.r{background:var(--redBg);color:var(--red)} .flag.a{background:var(--amberBg);color:var(--amber)}
.flag.g{background:var(--greenBg);color:var(--green)} .flag.b{background:var(--blueBg);color:var(--blue)}
.flag.n{background:var(--hover);color:var(--t3)}

.chk{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);
     font-size:15px;align-items:flex-start;line-height:1.6}
.chk:last-child{border-bottom:none}
.chk input{margin:5px 0 0;width:18px;height:18px;accent-color:var(--ink);flex:0 0 18px}
.chk .tt2{flex:1;min-width:0}
.chk .d{display:block;color:var(--t2);font-size:13.5px;margin-top:3px}
.chk.done .tt2{color:var(--t3);text-decoration:line-through}

.tb{width:100%;border-collapse:collapse;font-size:14.5px}
.tb td{padding:11px 12px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.6}
.tb td:first-child{color:var(--t2);font-size:13.5px;font-weight:600;width:32%}
.tb tr:last-child td{border-bottom:none}

/* ── 편집 UI ── */
.edit .ed{display:inline-flex}
.ed{display:none;align-items:center;gap:4px}
.eb{min-width:28px;height:28px;padding:0 6px;border-radius:8px;border:1px solid var(--line2);background:var(--card);
    cursor:pointer;font-size:12.5px;line-height:1;display:flex;align-items:center;justify-content:center;
    color:var(--t2);flex:0 0 auto;font-family:var(--f);font-weight:600}
.eb:active{background:var(--hover)}
.eb.del{color:var(--red);border-color:#E8CFCB}
.eb.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.addbtn{width:100%;padding:11px;border:1px dashed var(--line2);border-radius:11px;background:none;
        font-family:var(--f);font-size:14px;font-weight:600;color:var(--t3);cursor:pointer;margin-top:12px}
.addbtn:active{background:var(--hover)}
.addbtn.eonly{display:none} .edit .addbtn.eonly{display:block}
[contenteditable]{outline:none}
.edit [data-k]{border-bottom:1px dashed var(--line2);min-width:24px;display:inline-block;padding:0 2px}
.edit [data-k]:focus{background:#FFF8E1;border-bottom-color:var(--amber)}
.edit [data-blk]{border:1px dashed var(--line2);border-radius:8px;padding:7px 9px;display:block}
.edit [data-blk]:focus{background:#FFF8E1}
.esel{font-family:var(--f);font-size:12.5px;padding:4px 8px;border-radius:8px;
      border:1px solid var(--line2);background:var(--card);color:var(--t2);max-width:100%}
.erow{display:none;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.edit .erow{display:flex}
.erow input{font-family:var(--f);font-size:12.5px;padding:5px 8px;border-radius:8px;
      border:1px solid var(--line2);background:var(--card);width:96px}
.erow label{font-size:11.5px;color:var(--t3);font-weight:700}
.eonly{display:none} .edit .eonly{display:block}
.edit .day summary{cursor:default}

/* ── 시트 ── */
.mask{position:fixed;inset:0;z-index:90;background:rgba(20,20,19,.5);display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
@media(min-width:768px){.mask.on{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:660px;border-radius:18px 18px 0 0;
       padding:8px 18px calc(30px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
@media(min-width:768px){.sheet{border-radius:18px;max-height:84vh;padding:8px 26px 30px}}
.grab{width:38px;height:4px;background:var(--line2);border-radius:4px;margin:8px auto 18px}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.03em;margin:0 0 4px}
.sheet h4{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--t3);margin:20px 0 8px}
.sheet .sm{font-size:13.5px;color:var(--t2);margin:0 0 16px}
.cls{width:100%;margin-top:20px;padding:14px;border:1px solid var(--line2);background:var(--card);
     border-radius:11px;font-family:var(--f);font-size:15px;font-weight:600;color:var(--t2);cursor:pointer}
.pkr{width:100%;text-align:left;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;
     border:1px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;
     font-family:var(--f);font-size:15px;color:var(--ink);margin-bottom:7px;line-height:1.5}
.pkr:active{background:var(--hover)}
.pkr .e{flex:0 0 22px;font-size:17px}
.pkr .t{flex:1;min-width:0;font-weight:600}
.pkr .s{display:block;font-size:12.5px;color:var(--t2);font-weight:400;margin-top:1px}
.pkr.acc{border-color:var(--ink);background:var(--ink);color:#fff}
.pkr.acc .s{color:rgba(255,255,255,.72)}
.si{width:100%;font-family:var(--f);font-size:15px;padding:12px 14px;border-radius:11px;
    border:1px solid var(--line2);background:var(--card);margin-bottom:8px}
.si:focus{outline:none;border-color:var(--blue)}
.srow{display:flex;gap:8px;margin-bottom:8px}
.srow .si{margin-bottom:0}
.hint{font-size:12.5px;color:var(--t3);line-height:1.6;margin:8px 0 0}
.foot{font-size:12.5px;color:var(--t3);text-align:center;padding:24px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 20px);
       background:var(--ink);color:#fff;padding:10px 18px;border-radius:100px;font-size:13.5px;
       font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:86%;text-align:center}
.toast.on{opacity:1}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);
      border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top"><div class="wrap"><div class="in">
  <div class="tt" id="topTitle">이탈리아 가족여행</div>
  <button class="tgl" id="editBtn">✏️ 편집</button>
  <button class="icb" id="menuBtn" title="저장·불러오기">⋯</button>
</div></div></div>

<section data-p="pl" class="on"><div class="wrap">
  <div id="planTop"></div>
  <div id="days"></div>
  <button class="addbtn eonly" onclick="addDay()">+ 날짜 추가</button>
</div></section>

<section data-p="st"><div class="wrap">
  <div id="stays"></div>
  <button class="addbtn eonly" onclick="addStay()">+ 숙소 추가</button>
</div></section>

<section data-p="tr"><div class="wrap">
  <p class="lead">투어를 여기에 등록해 두면 일정표의 <b>＋</b> 버튼에서 바로 골라 넣을 수 있습니다.</p>
  <div id="tours"></div>
</div></section>

<section data-p="sp"><div class="wrap">
  <p class="lead">도시별로 가고 싶은 곳을 <b>검색해서 담아 두면</b>, 일정표의 <b>＋</b> 버튼에 그 도시 목록만 나옵니다.</p>
  <div id="spots"></div>
</div></section>

<section data-p="ea"><div class="wrap">
  <p class="lead">여기 담아 둔 식당이 일정표의 <b>아침·점심·저녁식사</b> 선택지가 됩니다. 그날 도시의 식당만 보입니다.</p>
  <div id="eats"></div>
</div></section>

<section data-p="pr"><div class="wrap">
  <div id="todos"></div>
  <button class="addbtn" onclick="addTodoGroup()">+ 그룹 추가</button>
  <p class="foot">체크 상태도 함께 저장됩니다</p>
</div></section>

<section data-p="rf"><div class="wrap">
  <div id="info"></div>
  <button class="addbtn" onclick="addInfoGroup()">+ 정보 블록 추가</button>
  <div id="cityAdmin"></div>
</div></section>

function load(){
  if(HAS_LS){ try{ var s=localStorage.getItem(KEY); if(s){ D=JSON.parse(s); normalize(); return; } }catch(e){} }
  D=JSON.parse(JSON.stringify(DEFAULT)); normalize();
}
function save(){
  if(!HAS_LS) return;
  try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast("저장 실패 — 용량 초과"); }
}
function normalize(){
  ["cities","planTop","days","spots","stays","tours","eats","todos","info"].forEach(function(k){ if(!D[k]) D[k]=[]; });
  if(!D.meta) D.meta={title:"여행 일정",sub:""};
  var seq=1;
  function fix(list,pre){ list.forEach(function(o){ if(!o.id) o.id=pre+"_"+(seq++)+"_"+list.length; }); }
  fix(D.spots,"sp"); fix(D.stays,"h"); fix(D.tours,"t"); fix(D.eats,"e"); fix(D.cities,"c");
  D.days.forEach(function(d){
    if(!d.cty) d.cty=[];
    if(!d.items) d.items=[]; if(!d.notes) d.notes=[]; if(!d.links) d.links=[];
    d.items.forEach(function(it){ if(!it.k) it.k="free"; if(it.k==="meal"&&!it.meal) it.meal="s"; });
  });
}
function toast(m){
  var t=document.getElementById("toast"); t.innerHTML=m; t.classList.add("on");
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove("on")},1900);
}

/* ══════════════════ 경로 · 공용 ══════════════════ */
function setPath(p,v){
  var a=p.split("."),o=D;
  for(var i=0;i<a.length-1;i++) o=o[isNaN(a[i])?a[i]:+a[i]];
  o[isNaN(a[a.length-1])?a[a.length-1]:+a[a.length-1]]=v;
  save();
}
function getPath(p){
  var a=p.split("."),o=D;
  for(var i=0;i<a.length;i++){ if(o==null) return null; o=o[isNaN(a[i])?a[i]:+a[i]]; }
  return o;
}
function esc(s){ return String(s==null?"":s); }
function at(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function txt(s){ var d=document.createElement("div"); d.innerHTML=String(s==null?"":s); return d.textContent||""; }
function ce(path,val,blk){
  return '<span '+(blk?'data-blk="1" ':'')+'data-k="'+path+'" contenteditable="'+(EDIT?'true':'false')+'">'+esc(val)+'</span>';
}
function findIn(arr,id){ for(var i=0;i<(arr||[]).length;i++) if(arr[i].id===id) return arr[i]; return null; }
function city(id){ return findIn(D.cities,id)||{id:id||"",nm:id||"미지정",en:"",c:"#5F5E5B",bg:"#F4F3F1"}; }
function cityChip(id){ var c=city(id); return '<span class="cchip" style="background:'+c.bg+';color:'+c.c+'">'+esc(c.nm)+'</span>'; }
function newId(pre){ var n=1; while(findIn(D.spots,pre+n)||findIn(D.eats,pre+n)||findIn(D.tours,pre+n)||findIn(D.stays,pre+n)||findIn(D.cities,pre+n)) n++; return pre+n; }
function mv(arrPath,i,dir){
  var a=getPath(arrPath); var j=i+dir;
  if(j<0||j>=a.length) return;
  var t=a[i]; a[i]=a[j]; a[j]=t; save(); render();
}
function del(arrPath,i,msg){
  if(!confirm(msg||"삭제할까요?")) return;
  getPath(arrPath).splice(i,1); save(); render();
}
function ctrl(arrPath,i,label){
  return '<span class="ed">'+
    '<button class="eb" onclick="mv(\''+arrPath+'\','+i+',-1)" title="위로">↑</button>'+
    '<button class="eb" onclick="mv(\''+arrPath+'\','+i+',1)" title="아래로">↓</button>'+
    '<button class="eb del" onclick="del(\''+arrPath+'\','+i+',\''+(label||"삭제할까요?")+'\')" title="삭제">✕</button></span>';
}
function selOpts(list,cur){
  return list.map(function(o){ return '<option value="'+at(o[0])+'"'+(String(cur)===String(o[0])?" selected":"")+'>'+esc(o[1])+'</option>'; }).join("");
}

/* free · move · wake · sleep 의 ref 는 "지도에 찍을 지점"만 가리킵니다(이름은 x 그대로) */
function ptOnly(k){ return k==="free"||k==="move"||k==="wake"||k==="sleep"; }
function refRec(it){
  if(!it.ref) return null;
  if(it.k==="meal") return findIn(D.eats,it.ref);
  if(it.k==="tour") return findIn(D.tours,it.ref);
  if(it.k==="stay") return findIn(D.stays,it.ref);
  if(it.k==="spot") return findIn(D.spots,it.ref);
  return findIn(D.spots,it.ref)||findIn(D.stays,it.ref)||findIn(D.eats,it.ref);
}
function recName(k,r){ if(!r) return ""; return r.n||r.nm||""; }
function itemName(it){
  if(ptOnly(it.k)) return it.x||"";
  var r=refRec(it);
  if(r) return recName(it.k,r);
  return it.x||"";
}
function itemUrl(it){ if(ptOnly(it.k)) return ""; var r=refRec(it); return (r&&r.u)?r.u:""; }
function itemPt(it){
  if(it.pt && (it.pt.la||it.pt.ln)) return {n:it.pt.n||itemName(it),la:+it.pt.la,ln:+it.pt.ln};
  var r=refRec(it); if(!r) return null;
  if(it.k==="tour"){
    var sp=r.sp?findIn(D.spots,r.sp):null;
    if(sp&&sp.la) return {n:r.nm,la:+sp.la,ln:+sp.ln};
  }
  if(r.la) return {n:recName(it.k,r),la:+r.la,ln:+r.ln};
  return null;
}
function kindName(it){ return it.k==="meal" ? MEALS[it.meal||"s"].n : (KINDS[it.k]?KINDS[it.k].n:"일정"); }
function kindIcon(it){ return it.k==="meal" ? MEALS[it.meal||"s"].e : (KINDS[it.k]?KINDS[it.k].e:"✏️"); }
function dayCities(di){ var d=D.days[di]; return (d.cty&&d.cty.length)?d.cty:D.cities.map(function(c){return c.id}); }
function usedIn(id){
  var out=[];
  D.days.forEach(function(d){ d.items.forEach(function(it){ if(it.ref===id) out.push(d.d+"일"); }); });
  return out.filter(function(v,i,a){return a.indexOf(v)===i});
}

/* 참조 선택 목록 — 그날 도시가 먼저, 나머지는 "다른 도시" 로 */
function refSelect(di,ii,it){
  var pool = it.k==="meal"?D.eats : it.k==="tour"?D.tours : it.k==="stay"?D.stays : D.spots;
  var cur = it.ref||"", mine = dayCities(di), html="", other="";
  D.cities.forEach(function(c){
    var list=pool.filter(function(o){ return o.cty===c.id; });
    if(!list.length) return;
    var g='<optgroup label="'+at(c.nm)+'">'+list.map(function(o){
      return '<option value="'+at(o.id)+'"'+(cur===o.id?" selected":"")+'>'+esc(recName(it.k,o))+'</option>';
    }).join("")+'</optgroup>';
    if(mine.indexOf(c.id)>=0) html+=g; else other+=g;
  });
  var noCty=pool.filter(function(o){ return !o.cty || !findIn(D.cities,o.cty); });
  if(noCty.length) other+='<optgroup label="도시 미지정">'+noCty.map(function(o){
      return '<option value="'+at(o.id)+'"'+(cur===o.id?" selected":"")+'>'+esc(recName(it.k,o))+'</option>';
    }).join("")+'</optgroup>';
  var ph = it.k==="meal"?"식당 선택 —" : it.k==="tour"?"투어 선택 —" : it.k==="stay"?"숙소 선택 —" : "장소 선택 —";
  return '<select class="refsel'+(cur?"":" empty")+'" onchange="setRef('+di+','+ii+',this.value)">'+
    '<option value="">'+ph+'</option>'+html+
    (other?'<optgroup label="─ 다른 도시 ─"></optgroup>'+other:"")+
    (it.k!=="stay"?'<option value="__new">🔍 검색해서 새로 추가…</option>':"")+
    '</select>';
}
function setRef(di,ii,v){
  var it=D.days[di].items[ii];
  if(v==="__new"){
    var cty=(D.days[di].cty&&D.days[di].cty[0])||"";
    openSearch(cty, it.k==="meal"?"eat":"spot", function(id){ it.ref=id; save(); render(); });
    return;
  }
  it.ref=v; save(); render();
}

function setT(di,ii,v){ D.days[di].items[ii].t=v; save(); }
function togOff(di,ii){ var it=D.days[di].items[ii]; it.off=it.off?0:1; save(); render(); }
function setPt(di,ii,f,v){
  var it=D.days[di].items[ii];
  if(!it.pt) it.pt={n:"",la:0,ln:0};
  it.pt[f]=(f==="n")?v:(parseFloat(v)||0);
  if(!it.pt.n && !it.pt.la) it.pt=null;
  save(); render();
}
function tmin(s){
  var m=/^(\d{1,2}):(\d{2})/.exec(String(s||"")); if(!m) return 99999;
  var v=(+m[1])*60+(+m[2]); if(v<240) v+=1440; return v;   /* 새벽 0~4시는 그날 끝으로 */
}
function sortDay(di){
  var a=D.days[di].items.map(function(it,i){return {it:it,i:i}});
  a.sort(function(x,y){ var d=tmin(x.it.t)-tmin(y.it.t); return d||(x.i-y.i); });
  D.days[di].items=a.map(function(o){return o.it}); save(); render(); toast("시간순으로 정렬했습니다");
}
function resetFixed(di){
  var d=D.days[di], need=[["wake",""],["meal","b"],["meal","l"],["meal","d"],["sleep",""]];
  var addc=0;
  need.forEach(function(n){
    var has=d.items.some(function(it){ return it.k===n[0] && (n[0]!=="meal"||it.meal===n[1]); });
    if(has) return;
    var t={wake:"07:30",sleep:"22:30"}[n[0]] || {b:"08:00",l:"13:00",d:"19:00"}[n[1]];
    d.items.push({k:n[0],meal:n[1]||undefined,t:t,x:"",dd:"",m:"",pt:null,ref:""}); addc++;
  });
  if(!addc){ toast("고정 항목이 이미 모두 있습니다"); return; }
  sortDay(di); toast(addc+"개를 채우고 시간순 정렬했습니다");
}

/* ══════════════════ ＋ 로 일정 끼워 넣기 ══════════════════ */
function guessT(items,pos){
  var p=pos>0?tmin(items[pos-1].t):99999, n=pos<items.length?tmin(items[pos].t):99999, v;
  if(p<99999&&n<99999&&n>p) v=Math.round((p+n)/2);
  else if(p<99999) v=p+60;
  else if(n<99999) v=n-60;
  else v=600;
  v=((Math.round(v)%1440)+1440)%1440;
  return ("0"+Math.floor(v/60)).slice(-2)+":"+("0"+(v%60)).slice(-2);
}
function insItem(di,pos,k,ref,meal){
  var d=D.days[di];
  var it={k:k,t:guessT(d.items,pos),x:"",dd:"",m:"",pt:null,ref:ref||""};
  if(k==="meal") it.meal=meal||"s";
  if(k==="free"&&!ref) it.x="새 일정";
  if(k==="move") it.x="이동";
  d.items.splice(pos,0,it);
  save(); OPEN[di]=true; render(); closeSheet(); toast("추가했습니다 — 시간을 눌러 조정하세요");
}

function pickList(di,pos,k){

  var ttl  = k==="meal"?"식당 · 카페" : k==="tour"?"투어" : k==="stay"?"숙소" : "관광지";
  var mine=dayCities(di), h='<h3>'+ttl+' 선택</h3>';

    s+=list.map(function(o){
      var nm=recName(k,o);

                k==="tour" ? esc(o.dt||"") :

    }).join("");
    return s;
  };
  var mineHtml=mine.map(block).join("");
  var otherHtml=D.cities.filter(function(c){return mine.indexOf(c.id)<0}).map(function(c){return block(c.id)}).join("");
  h+= mineHtml || '<p class="sm">이 도시에 등록된 항목이 없습니다. 아래에서 검색해 추가하세요.</p>';
  h+= '<h4 style="margin-top:24px">새로 추가</h4>'+
      '<button class="pkr acc" onclick="searchInto('+di+','+pos+',\''+(k==="meal"?"eat":"spot")+'\')"><span class="e">🔍</span>'+
      '<span class="t">검색해서 추가<span class="s">찾은 곳은 '+(k==="meal"?"식당":"관광지")+' 탭에도 저장됩니다</span></span></button>';

  openSheet(h);

    var im=s.img?'<img src="'+at(s.img)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display=&#39;none&#39;">':"";
    var used=usedIn(s.id);
    return '<div class="stay"><div class="im"><div class="tile" style="background:linear-gradient(140deg,'+(s.c1||"#5F5E5B")+','+(s.c2||"#333")+')">'+
      '<span class="e">'+esc(s.e)+'</span><span class="l">'+esc(city(s.cty).nm)+'</span></div>'+im+'</div>'+
      '<div class="bd"><div class="city">'+cityChip(s.cty)+'</div>'+
      '<div class="nm">'+ce(P+".nm",s.nm)+'</div>'+
      '<div class="dt">'+ce(P+".dt",s.dt)+'</div>'+
      '<div class="ds">'+ce(P+".ds",s.ds,true)+'</div>'+
      (used.length?'<div class="used">일정 사용 — '+used.join(", ")+'</div>':"")+
      '<div class="links">'+(s.u?'<a class="lk sm" href="'+at(s.u)+'" target="_blank" rel="noopener">숙소 페이지 ↗</a>':"")+
        (s.la?'<a class="lk sm" href="https://www.google.com/maps/search/?api=1&query='+s.la+','+s.ln+'" target="_blank" rel="noopener">지도 ↗</a>':"")+'</div>'+
      '<span class="erow"><label>도시</label><select class="esel" onchange="setPath(\''+P+'.cty\',this.value);render()">'+
        selOpts(D.cities.map(function(c){return [c.id,c.nm]}),s.cty)+'</select>'+
      '<label>위도</label><input value="'+at(s.la||"")+'" onchange="setPath(\''+P+'.la\',parseFloat(this.value)||0);render()" style="width:80px">'+
      '<label>경도</label><input value="'+at(s.ln||"")+'" onchange="setPath(\''+P+'.ln\',parseFloat(this.value)||0);render()" style="width:80px">'+
      '<label>이미지</label><input style="flex:1;min-width:140px" value="'+at(s.img)+'" placeholder="이미지 URL" onchange="setPath(\''+P+'.img\',this.value);render()">'+

  }).join("");

/* ══════════════════ 검색 (OpenStreetMap Nominatim) ══════════════════ */
function openSearch(cty,type,cb){
  SCB=cb||null; SRES=[];
  openSheet(searchHtml(cty||((D.cities[0]||{}).id||""),type));
  setTimeout(function(){ var e=document.getElementById("sq"); if(e) e.focus(); },60);
}
function searchHtml(cty,type){
  var t=(type==="eat")?"식당":"관광지";
  return '<h3>'+t+' 검색</h3>'+
   '<p class="sm">찾은 곳은 <b>'+t+' 탭</b>에 좌표까지 함께 저장됩니다</p>'+
   '<input type="hidden" id="stype" value="'+at(type)+'">'+
   '<select class="si" id="scty">'+selOpts(D.cities.map(function(c){return [c.id,c.nm]}),cty)+'</select>'+
   '<div class="srow"><input class="si" id="sq" placeholder="'+(type==="eat"?"예: Trattoria Mario":"예: 콜로세움 · Colosseo")+
     '" onkeydown="if(event.key===&#39;Enter&#39;){event.preventDefault();doSearch()}">'+
     '<button class="lk f" onclick="doSearch()">검색</button></div>'+
   '<div id="sres"></div>'+
   '<h4>직접 입력</h4>'+
   '<input class="si" id="mn" placeholder="이름">'+
   '<div class="srow"><input class="si" id="mla" placeholder="위도 (선택)"><input class="si" id="mln" placeholder="경도 (선택)"></div>'+
   '<button class="lk" style="width:100%;justify-content:center" onclick="addManual()">+ 직접 추가</button>'+
   '<p class="hint">검색은 무료 공개 서비스(OpenStreetMap Nominatim)를 씁니다. 연속으로 누르지 말고 1초쯤 간격을 두세요.<br>결과가 없으면 현지어 이름(Colosseo, Duomo)으로 다시 시도해 보세요.</p>';
}
function doSearch(){
  var q=(document.getElementById("sq").value||"").trim();
  var cty=document.getElementById("scty").value;
  var box=document.getElementById("sres");
  if(!q){ box.innerHTML='<p class="hint">검색어를 입력하세요.</p>'; return; }
  var c=city(cty), full=q+(c.en?(", "+c.en):"");
  box.innerHTML='<p class="hint"><span class="spin"></span> &nbsp;<b>'+esc(full)+'</b> 검색 중…</p>';
  var url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=ko,en&q="+encodeURIComponent(full);
  fetch(url,{headers:{"Accept":"application/json"}})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(js){
      SRES=js||[];
      if(!SRES.length){ box.innerHTML='<p class="hint">결과가 없습니다. 현지어 이름으로 다시 시도하거나 아래에서 직접 입력하세요.</p>'; return; }
      box.innerHTML='<h4>검색 결과 '+SRES.length+'건</h4>'+SRES.map(function(r,i){
        var nm=(r.name||String(r.display_name||"").split(",")[0]||"").trim();
        var ad=String(r.display_name||"").split(",").slice(1,4).join(",").trim();
        return '<button class="pkr" onclick="takeRes('+i+')"><span class="e">📍</span><span class="t">'+esc(nm)+
          '<span class="s">'+esc(ad)+' · '+esc(r.type||"")+'</span></span></button>';
      }).join("");
    })
    .catch(function(){
      box.innerHTML='<p class="hint">검색에 실패했습니다. 인터넷 연결을 확인하거나(오프라인·차단 환경) 아래에서 직접 입력해 주세요.</p>';
    });
}
function addRec(type,cty,n,d,la,ln,u){
  var id;
  if(type==="eat"){
    id=newId("e");
    D.eats.push({id:id,cty:cty,n:n,g:d||"",f:"검색 추가",fc:"b",d:"",la:la||0,ln:ln||0,u:u||""});
  }else{
    id=newId("sp");
    D.spots.push({id:id,cty:cty,tp:"sg",n:n,d:d||"",la:la||0,ln:ln||0,u:u||""});
  }
  save(); return id;
}
function takeRes(i){
  var r=SRES[i]; if(!r) return;
  var type=document.getElementById("stype").value, cty=document.getElementById("scty").value;
  var nm=(r.name||String(r.display_name||"").split(",")[0]||"").trim();
  var ad=String(r.display_name||"").split(",").slice(1,4).join(",").trim();
  var la=parseFloat(r.lat), ln=parseFloat(r.lon);
  var id=addRec(type,cty,nm,ad,la,ln,"https://www.google.com/maps/search/?api=1&query="+la+","+ln);
  finishAdd(id,nm);
}
function addManual(){
  var n=(document.getElementById("mn").value||"").trim();
  if(!n){ toast("이름을 입력하세요"); return; }
  var type=document.getElementById("stype").value, cty=document.getElementById("scty").value;
  var la=parseFloat(document.getElementById("mla").value)||0, ln=parseFloat(document.getElementById("mln").value)||0;
  var id=addRec(type,cty,n,"",la,ln,la?("https://www.google.com/maps/search/?api=1&query="+la+","+ln):"");
  finishAdd(id,n);
}
function finishAdd(id,nm){
  var cb=SCB; SCB=null;
  if(cb){ cb(id); }
  else{ render(); closeSheet(); toast("<b>"+esc(nm)+"</b> 담았습니다"); }
}

/* ══════════════════ 지도 ══════════════════ */
function buildMap(el){
  if(el.dataset.done||typeof L==="undefined") return;
  var di=+el.dataset.m, day=D.days[di]; if(!day) return;
  var pts=[];
  day.items.forEach(function(it){
    if(it.off) return;
    var p=itemPt(it);
    if(p && p.la) pts.push({n:p.n||itemName(it)||kindName(it),la:p.la,ln:p.ln,m:it.m});
  });
  if(pts.length<1){ el.style.display="none"; return; }
  el.dataset.done="1"; el.style.display="";
  var map=L.map(el,{scrollWheelZoom:false,attributionControl:false});
  L.tileLayer("https://mt{s}.google.com/vt/lyrs=m&hl=ko&x={x}&y={y}&z={z}",
    {subdomains:["0","1","2","3"],maxZoom:20}).addTo(map);
  var ll=pts.map(function(p){return [p.la,p.ln]});
  for(var i=1;i<pts.length;i++){
    var m=pts[i].m, w=(m==="w"||!m);
    L.polyline([ll[i-1],ll[i]],{color:MODEC[m]||"#8E8D89",weight:w?3:4.5,opacity:.92,
      dashArray:w?"2,7":null,lineCap:"round"}).addTo(map)
      .bindPopup("<b>"+i+" &rarr; "+(i+1)+"</b><br>"+esc(pts[i-1].n)+" &rarr; "+esc(pts[i].n)+"<br>"+(MODES[m]||""));
  }
  pts.forEach(function(p,i){
    var n=i+1,last=(i===pts.length-1);
    var bg=i===0?"#3D7A55":(last?"#B34A42":"#2F6FA8");
    L.marker([p.la,p.ln],{zIndexOffset:100,icon:L.divIcon({className:"",iconSize:[23,23],iconAnchor:[11,11],
      html:'<div class="mnum" style="background:'+bg+'">'+n+'</div>'})}).addTo(map)
      .bindTooltip('<b>'+n+'</b> '+esc(p.n),{permanent:true,direction:"right",offset:[13,0],className:"mlbl"})
      .bindPopup("<b>"+n+". "+esc(p.n)+"</b>");
  });
  var s=document.createElement("div"); s.className="rs";
  s.innerHTML=pts.map(function(p,i){
    var c=i===0?"s":(i===pts.length-1?"e":"");
    return '<span class="ri"><span class="pn '+c+'">'+(i+1)+'</span>'+esc(p.n)+'</span>';
  }).join('<span class="ar">&rsaquo;</span>');
  el.parentNode.insertBefore(s,el.nextSibling);
  map.fitBounds(L.latLngBounds(ll).pad(0.28));
  setTimeout(function(){map.invalidateSize()},120);
}

/* ══════════════════ 바인딩 ══════════════════ */
function bindEditable(){
  document.querySelectorAll("[data-k]").forEach(function(el){
    el.setAttribute("contenteditable", EDIT?"true":"false");
    if(el.dataset.bound) return;
    el.dataset.bound="1";
    el.addEventListener("blur",function(){ setPath(el.dataset.k, el.innerHTML); });
    el.addEventListener("keydown",function(e){
      if(e.key==="Enter" && !el.dataset.blk){ e.preventDefault(); el.blur(); }
    });
    el.addEventListener("click",function(e){ if(EDIT) e.stopPropagation(); });
  });
}
function bindDays(){
  var ds=document.querySelectorAll("details.day");
  ds.forEach(function(d){
    d.addEventListener("toggle",function(){
      var di=+d.dataset.di;
      OPEN[di]=d.open;
      if(!d.open) return;
      var el=d.querySelector(".map");
      if(el) setTimeout(function(){ buildMap(el); },40);
    });
    if(d.open){ var el=d.querySelector(".map"); if(el) setTimeout(function(){ buildMap(el); },40); }
  });
}

/* ══════════════════ 시트 · 저장/불러오기 ══════════════════ */
function openSheet(html){
  document.getElementById("sb").innerHTML=html;
  document.getElementById("mask").classList.add("on");
  document.body.style.overflow="hidden";
  document.querySelector(".sheet").scrollTop=0;
}
function closeSheet(){
  SCB=null;
  document.getElementById("mask").classList.remove("on");
  document.body.style.overflow="";
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="italy-trip-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("JSON 파일을 내려받았습니다");
}
function importJSON(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ D=JSON.parse(r.result); normalize(); save(); render(); closeSheet(); toast("불러왔습니다"); }
    catch(e){ alert("JSON 형식이 아닙니다."); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm("모든 편집 내용을 지우고 기본 일정으로 되돌릴까요?")) return;
  D=JSON.parse(JSON.stringify(DEFAULT)); normalize(); save(); render(); closeSheet(); toast("초기화했습니다");
}
