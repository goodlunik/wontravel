<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>이탈리아 가족여행 · 편집 가능한 일정표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js" defer></script>
<style>
:root{
  --bg:#FBFBFA; --card:#FFF; --ink:#1F1F1E; --t2:#5F5E5B; --t3:#8E8D89;
  --line:#EBEAE7; --line2:#DDDCD8; --hover:#F4F3F1; --gray:#F2F1EF;
  --blue:#2F6FA8; --blueBg:#EAF3F9; --red:#B34A42; --redBg:#FBEEEC;
  --amber:#A9761C; --amberBg:#FCF3E0; --green:#3D7A55; --greenBg:#EBF4EE;
  --f:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif;
  --pad:14px; --nav:56px;
  --zTop:400; --zNav:500; --zMask:2000; --zToast:2200;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;
     line-height:1.68;letter-spacing:-.012em;-webkit-font-smoothing:antialiased;
     padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px);overflow-x:hidden}
a{color:inherit;text-decoration:none}
img{max-width:100%}
.wrap{width:100%;max-width:none;margin:0;padding:0 var(--pad)}
@media(min-width:600px){:root{--pad:20px} body{font-size:15.5px}}
@media(min-width:1024px){:root{--pad:28px} body{font-size:16px}}

/* ── 상단 ── */
.top{position:sticky;top:0;z-index:var(--zTop);background:rgba(251,251,250,.96);
     backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:7px;padding:9px 0}
.top .tt{flex:1;min-width:0;font-size:14.5px;font-weight:800;letter-spacing:-.025em;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tgl{display:inline-flex;align-items:center;padding:7px 12px;border-radius:9px;
     border:1px solid var(--line2);background:var(--card);font-family:var(--f);
     font-size:12.5px;font-weight:700;color:var(--t2);cursor:pointer;white-space:nowrap}
.tgl.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.syn{font-size:11.5px;font-weight:700;color:var(--t3);white-space:nowrap;letter-spacing:-.02em}
.syn.ok{color:#3D7A55}
.syn.off{color:#B34A42}
.icb{width:33px;height:33px;flex:0 0 33px;border-radius:9px;border:1px solid var(--line2);
     background:var(--card);cursor:pointer;font-size:15px;line-height:1;
     display:flex;align-items:center;justify-content:center;font-family:var(--f);color:var(--t2)}
.icb:active{background:var(--hover)}

/* ── 하단 탭 (텍스트 전용) ── */
nav{position:fixed;left:0;right:0;bottom:0;z-index:var(--zNav);background:rgba(255,255,255,.97);
    backdrop-filter:saturate(180%) blur(14px);border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;border:0;background:none;font-family:var(--f);cursor:pointer;
    padding:16px 2px;font-size:13.5px;font-weight:700;color:var(--t3);letter-spacing:-.03em;
    position:relative}
nav button.on{color:var(--ink)}
nav button.on::after{content:"";position:absolute;left:50%;transform:translateX(-50%);
    bottom:8px;width:18px;height:2px;border-radius:2px;background:var(--ink)}
section[data-p]{display:none;padding-top:18px}
section[data-p].on{display:block}

/* 하위 탭 */
.subnav{display:flex;gap:6px;overflow-x:auto;padding:0 0 14px;margin:0 0 4px;
        -webkit-overflow-scrolling:touch;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;border:1px solid var(--line2);background:var(--card);
   border-radius:100px;padding:7px 15px;font-family:var(--f);font-size:13px;
   font-weight:700;color:var(--t2);cursor:pointer;white-space:nowrap}
.subnav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
div[data-s]{display:none} div[data-s].on{display:block}

h2{font-size:17px;font-weight:800;letter-spacing:-.03em;margin:24px 0 10px;
   display:flex;align-items:center;gap:7px;flex-wrap:wrap;line-height:1.4}
h2:first-child{margin-top:0}
.lead{color:var(--t2);font-size:13.5px;margin:0 0 14px;line-height:1.65}
.cnt{font-size:12px;color:var(--t3);font-weight:600}

.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:12px}
.co{display:block;padding:13px 14px;border-radius:11px;background:var(--hover);
    font-size:13.5px;line-height:1.65;margin:12px 0}
.co .i{flex:0 0 19px;font-size:16px;line-height:1.35}
.co .c{display:block;min-width:0;overflow-wrap:anywhere}
.co b{font-weight:700}
.co.r{background:var(--redBg);color:#6E2E28} .co.r b{color:#5A241F}
.co.a{background:var(--amberBg);color:#6B4A11} .co.a b{color:#553A0B}
.co.b{background:var(--blueBg);color:#1E4A70} .co.b b{color:#173A58}
.co.g{background:var(--greenBg);color:#2A5539} .co.g b{color:#20422C}

/* ── 날짜 카드 ── */
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
.day[open]{border-color:var(--line2);box-shadow:0 5px 20px rgba(31,31,30,.07)}
.day summary{list-style:none;cursor:pointer;display:flex;gap:11px;align-items:center;padding:13px 14px}
.day summary::-webkit-details-marker{display:none}
.dbadge{flex:0 0 48px;text-align:center;padding:7px 0;border-radius:10px;background:var(--hover)}
.dbadge .n{font-size:18px;font-weight:800;line-height:1.1;letter-spacing:-.04em}
.dbadge .w{font-size:10.5px;font-weight:600;opacity:.72;margin-top:1px}
.dtx{flex:1;min-width:0}
.dtx .city{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:3px}
.dtx .ttl{font-size:16px;font-weight:700;letter-spacing:-.025em;line-height:1.3}
.dtx .sub{font-size:12.5px;color:var(--t2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{flex:0 0 14px;color:var(--t3);font-size:13px;transition:transform .18s}
.day[open] .chev{transform:rotate(90deg)}
.dbody{padding:14px;border-top:1px solid var(--line)}
.cchip{display:inline-block;padding:1px 7px;border-radius:100px;font-size:10px;font-weight:700;line-height:16px}

/* ── 지도 : 1:1 · 스태킹 격리 ── */
.mapbox{margin:0}
.maptr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mapt.mvt{margin-left:auto}
.mapt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;
      border:1px solid var(--line2);background:var(--card);font-family:var(--f);
      font-size:12.5px;font-weight:600;color:var(--t2);cursor:pointer}
.mapt:active{background:var(--hover)}
.mapt .cv{color:var(--t3);font-size:13px;line-height:1;transition:transform .18s}
.mapt.on .cv{transform:rotate(90deg)}
.mapw[hidden]{display:none}
.mapw{position:relative;z-index:0;isolation:isolate;width:100%;max-width:560px;margin:10px auto 0}
.map{width:100%;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:var(--hover);border:1px solid var(--line)}
.leaflet-container{font-family:var(--f)}
.rs{display:flex;flex-wrap:wrap;align-items:center;margin:10px 0 0;font-size:12px;color:var(--t2);line-height:1.9}
.rs .ri{display:inline-flex;align-items:center;white-space:nowrap}
.pn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;
    border-radius:6px;background:var(--blue);color:#fff;font-size:10px;font-weight:800;margin-right:5px;flex:0 0 auto}
.pn.s{background:var(--green)} .pn.e{background:var(--red)}
.rs .ar{color:var(--t3);margin:0 4px}
.mnum{width:22px;height:22px;border-radius:8px;color:#fff;border:2px solid #fff;
      font-family:var(--f);font-size:11px;font-weight:800;line-height:18px;text-align:center;
      box-shadow:0 2px 6px rgba(0,0,0,.28)}
.mlbl{font-family:var(--f);font-size:10.5px;font-weight:500;color:var(--t2);
      background:none;padding:0 0 0 1px;border:0;border-radius:0;box-shadow:none;white-space:nowrap;
      text-shadow:0 1px 2px #fff,0 -1px 2px #fff,1px 0 2px #fff,-1px 0 2px #fff}
.mlbl:before{display:none}
.leaflet-control-attribution{font-size:9px;line-height:1.5;padding:0 4px;color:var(--t3);
      background:rgba(255,255,255,.72);border-radius:5px 0 0 0}
.leaflet-control-attribution a{color:var(--t3);text-decoration:none}

/* ── 일정 사진 : 정사각형 ── */
.thb{flex:0 0 56px;width:56px;aspect-ratio:1/1;border-radius:10px;overflow:hidden;
     background:var(--hover);border:1px solid var(--line);margin-top:1px;cursor:zoom-in}
.thb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .18s}
.thb:active img{transform:scale(1.06)}
.thb.no{display:none}
@media(min-width:600px){.thb{flex:0 0 66px;width:66px}}

/* ── 사진 갤러리 (팝업) ── */
.galbig{position:relative;width:100%;aspect-ratio:4/3;border-radius:13px;overflow:hidden;
        background:#17171A;border:1px solid var(--line);margin-top:4px}
.galbig img{width:100%;height:100%;object-fit:contain;display:block}
.galnav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;
        border:0;background:rgba(20,20,19,.5);color:#fff;font-size:19px;line-height:34px;
        font-family:var(--f);cursor:pointer;padding:0}
.galnav:active{background:rgba(20,20,19,.75)}
.galnav.p{left:8px} .galnav.n{right:8px}
.galcnt{position:absolute;right:10px;bottom:9px;background:rgba(20,20,19,.62);color:#fff;
        font-size:11px;font-weight:700;padding:2px 8px;border-radius:100px}
.galstrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;margin-top:8px}
.galstrip button{padding:0;border:1px solid var(--line2);background:var(--hover);border-radius:8px;
                 overflow:hidden;aspect-ratio:1/1;cursor:pointer}
.galstrip button.on{border-color:var(--blue);box-shadow:0 0 0 2px var(--blueBg)}
.galstrip img{width:100%;height:100%;object-fit:cover;display:block}

/* ── 타임라인 : 행마다 구분선 ── */
.tl{list-style:none;margin:14px 0 0;padding:0}
.tl.nomv li.it.mv{display:none}          /* 이동 항목 접기 */
.tl li.it{display:flex;gap:10px;padding:11px 8px;align-items:flex-start;
          border-bottom:1px solid var(--line)}
.tl li.it:last-child{border-bottom:none}
.tl li.it.mv{background:var(--gray)}          /* 이동 = 연회색 */
.edit .tl li.it{border-bottom:none}
.tm{flex:0 0 44px;font-size:12px;font-weight:700;color:var(--t3);padding-top:2px;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tm input{width:100%;font-family:var(--f);font-size:12px;font-weight:700;color:var(--ink);
   border:1px solid var(--line2);background:var(--card);border-radius:7px;padding:3px 2px;
   font-variant-numeric:tabular-nums;min-width:0}
.tm input:focus{outline:none;border-color:var(--blue)}
.tm input::-webkit-calendar-picker-indicator{display:none}
.tx{flex:1;min-width:0;font-size:14.5px;line-height:1.55}
.tx .hd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.knm{font-size:10.5px;font-weight:700;color:var(--t3);background:var(--card);
     border:1px solid var(--line);border-radius:100px;padding:0 7px;line-height:17px;
     flex:0 0 auto;white-space:nowrap}
.it.mv .knm{background:#fff}
.tx .nm{font-weight:600;overflow-wrap:anywhere}
.it.mv .nm{font-weight:600;color:var(--t2)}
.tx .d{display:block;color:var(--t2);font-size:12.5px;margin-top:3px;line-height:1.6;overflow-wrap:anywhere}
.tx .dur{font-size:11px;font-weight:700;color:var(--t2);background:#fff;border:1px solid var(--line2);
     border-radius:100px;padding:0 7px;line-height:17px;white-space:nowrap}
.tx .lnk{font-size:11px;font-weight:700;color:var(--blue);white-space:nowrap}
.esel2{font-family:var(--f);font-size:14px;font-weight:600;color:var(--ink);
   border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:3px 6px;
   max-width:100%;cursor:pointer}
.esel2:focus{outline:none;border-color:var(--blue)}
.esel2.empty{color:var(--t3);font-weight:500}
.din{width:60px;font-family:var(--f);font-size:12px;border:1px solid var(--line2);
     background:var(--card);border-radius:7px;padding:3px 6px}

/* 행 사이 ＋ (편집 전용) */
.gap{display:none;align-items:center;gap:6px;height:19px}
.edit .gap{display:flex}
.gap .ln{flex:1;display:block;height:1px;background:var(--line)}
/* 이동 항목이 접혀 있으면 그 앞의 ＋ 줄도 같이 감춘다 — 선·＋ 가 두 번 겹치지 않도록 */
.tl.nomv li.gap:has(+ li.it.mv){display:none}
.gapb{flex:0 0 auto;width:20px;height:20px;border-radius:50%;border:1px dashed var(--line2);
  background:var(--card);color:var(--t3);font-family:var(--f);font-size:11px;line-height:1;
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.gapb:active{border-style:solid;border-color:var(--ink);color:var(--ink)}

.links{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.lk{display:inline-flex;align-items:center;padding:8px 12px;border-radius:10px;
    border:1px solid var(--line2);font-size:13px;font-weight:600;background:var(--card);
    cursor:pointer;font-family:var(--f);color:var(--ink)}
.lk.f{background:var(--ink);color:#fff;border-color:var(--ink)}
.lk.sm{padding:6px 10px;font-size:12px;border-radius:9px}

/* ── 카드 ── */
.grid{display:grid;grid-template-columns:1fr;gap:9px}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:1fr 1fr 1fr}}
@media(min-width:1400px){.grid{grid-template-columns:repeat(4,1fr)}}
.ec{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px;
    transition:opacity .15s,transform .12s,box-shadow .12s}
.ec .n{font-size:15px;font-weight:700;letter-spacing:-.025em;line-height:1.3;overflow-wrap:anywhere}
.ec .g{font-size:12.5px;color:var(--t2);margin-top:2px}
.ec .f{margin-top:8px;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.ec .d{font-size:12.5px;color:var(--t2);margin-top:7px;line-height:1.55}
.ec .used{font-size:11.5px;color:var(--blue);font-weight:700;margin-top:7px;line-height:1.5}
.flag{display:inline-block;padding:1px 8px;border-radius:100px;font-size:10.5px;font-weight:700}
.flag.r{background:var(--redBg);color:var(--red)} .flag.a{background:var(--amberBg);color:var(--amber)}
.flag.g{background:var(--greenBg);color:var(--green)} .flag.b{background:var(--blueBg);color:var(--blue)}
.flag.n{background:var(--hover);color:var(--t3)}

/* 숙소 */
.stay{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;
      overflow:hidden;margin-bottom:9px;transition:opacity .15s,transform .12s,box-shadow .12s}
.stay .im{flex:0 0 96px;position:relative;background:var(--hover)}
.stay .im::before{content:"";display:block;padding-top:100%}
.stay .im .tile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
      color:#fff;font-size:11px;font-weight:800;letter-spacing:.04em;text-align:center;padding:6px}
.stay .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.stay .bd{flex:1;min-width:0;padding:13px 14px}
.stay .nm{font-size:15.5px;font-weight:700;letter-spacing:-.025em;line-height:1.3;margin:4px 0 3px}
.stay .dt{font-size:12.5px;color:var(--t2)}
.stay .ds{font-size:12.5px;color:var(--t2);margin-top:6px;line-height:1.55}
@media(min-width:600px){.stay .im{flex:0 0 150px}.stay .bd{padding:16px 18px}}

/* 교통편 */
.trip{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 14px;
      margin-bottom:9px;transition:opacity .15s,transform .12s,box-shadow .12s}
.trip .hd{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.trip .dt{font-size:12px;color:var(--t3);font-weight:700}
.trip .nm{font-size:15px;font-weight:700;letter-spacing:-.025em;margin-top:3px}
.trip .rt{font-size:13px;color:var(--t2);margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.trip .mt{font-size:12.5px;color:var(--t2);margin-top:5px}

/* 꾹 눌러 순서 변경 */
body.dragging{user-select:none;-webkit-user-select:none;overflow:hidden}
body.dragging [data-drag]:not(.dg){opacity:.38}
[data-drag].dg{opacity:1!important;box-shadow:0 12px 34px rgba(31,31,30,.22);
   transform:scale(1.015);position:relative;z-index:8;border-color:var(--ink);touch-action:none}
.edit [data-drag]{cursor:grab}
.draghint{font-size:12px;color:var(--t3);margin:0 0 10px;line-height:1.6}

.chk{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);
     font-size:14px;align-items:flex-start;line-height:1.55}
.chk:last-child{border-bottom:none}
.chk input{margin:4px 0 0;width:17px;height:17px;accent-color:var(--ink);flex:0 0 17px}
.chk .tt2{flex:1;min-width:0}
.chk .d{display:block;color:var(--t2);font-size:12.5px;margin-top:2px}
.chk.done .tt2{color:var(--t3);text-decoration:line-through}

.tb{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
.tb td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top;
       line-height:1.55;overflow-wrap:anywhere}
.tb td:first-child{color:var(--t2);font-size:12.5px;font-weight:600;width:34%}
.tb tr:last-child td{border-bottom:none}

/* ── 편집 ── */
.ed{display:none;align-items:center;gap:4px;flex-wrap:wrap}
.edit .ed{display:inline-flex}
.eb{min-width:27px;height:27px;padding:0 7px;border-radius:8px;border:1px solid var(--line2);
    background:var(--card);cursor:pointer;font-size:12px;line-height:1;display:flex;
    align-items:center;justify-content:center;color:var(--t2);flex:0 0 auto;font-family:var(--f);font-weight:600}
.eb:active{background:var(--hover)}
.eb.del{color:var(--red);border-color:#E8CFCB}
.addbtn{width:100%;padding:10px;border:1px dashed var(--line2);border-radius:11px;background:none;
        font-family:var(--f);font-size:13.5px;font-weight:600;color:var(--t3);cursor:pointer;margin-top:10px}
.addbtn.eonly{display:none} .edit .addbtn.eonly{display:block}
.eonly{display:none} .edit .eonly{display:block}
[contenteditable]{outline:none}
.edit [data-k]{border-bottom:1px dashed var(--line2);min-width:22px;display:inline-block;padding:0 2px}
.edit [data-k]:focus{background:#FFF8E1;border-bottom-color:var(--amber)}
.edit [data-blk]{border:1px dashed var(--line2);border-radius:8px;padding:6px 8px;display:block}
.edit [data-blk]:focus{background:#FFF8E1}
.esel{font-family:var(--f);font-size:12px;padding:4px 7px;border-radius:8px;
      border:1px solid var(--line2);background:var(--card);color:var(--t2);max-width:100%}
.erow{display:none;gap:5px;flex-wrap:wrap;align-items:center;margin-top:7px;padding-top:7px;
      border-top:1px dashed var(--line)}
.edit .erow{display:flex}
.erow label{font-size:11px;color:var(--t3);font-weight:700}

/* ── 시트 ── */
.mask{position:fixed;inset:0;z-index:var(--zMask);background:rgba(20,20,19,.55);
      display:none;align-items:flex-end;justify-content:center}
.mask.on{display:flex}
@media(min-width:768px){.mask.on{align-items:center}}
.sheet{background:var(--bg);width:100%;max-width:600px;border-radius:18px 18px 0 0;
       padding:6px 14px calc(26px + env(safe-area-inset-bottom));max-height:86vh;overflow-y:auto;
       -webkit-overflow-scrolling:touch}
@media(min-width:768px){.sheet{border-radius:18px;max-height:84vh;padding:6px 22px 26px}}
.grab{width:36px;height:4px;background:var(--line2);border-radius:4px;margin:8px auto 15px}
.sheet h3{font-size:20px;font-weight:800;letter-spacing:-.035em;margin:0 0 3px}
.sheet h4{font-size:11.5px;font-weight:800;letter-spacing:.03em;color:var(--t3);margin:18px 0 7px}
.sheet .sm{font-size:12.5px;color:var(--t2);margin:0 0 14px;line-height:1.6}
.cls{width:100%;margin-top:16px;padding:13px;border:1px solid var(--line2);background:var(--card);
     border-radius:11px;font-family:var(--f);font-size:14.5px;font-weight:600;color:var(--t2);cursor:pointer}
.pkr{width:100%;text-align:left;display:block;padding:11px 13px;border:1px solid var(--line);
     border-radius:11px;background:var(--card);cursor:pointer;font-family:var(--f);
     font-size:14px;color:var(--ink);margin-bottom:6px;line-height:1.45;font-weight:600}
.pkr:active{background:var(--hover)}
.pkr .s{display:block;font-size:12px;color:var(--t2);font-weight:400;margin-top:1px}
.pkr.acc{border-color:var(--ink);background:var(--ink);color:#fff}
.pkr.acc .s{color:rgba(255,255,255,.72)}
.fl{display:block;font-size:11.5px;font-weight:700;color:var(--t3);margin:12px 0 4px}
.si{width:100%;font-family:var(--f);font-size:15px;padding:11px 13px;border-radius:11px;
    border:1px solid var(--line2);background:var(--card);margin-bottom:2px}
.si:focus{outline:none;border-color:var(--blue)}
textarea.si{min-height:72px;resize:vertical;line-height:1.6}
.srow{display:flex;gap:7px}
.srow .si{margin-bottom:0}
.hint{font-size:12px;color:var(--t3);line-height:1.6;margin:7px 0 0}
.foot{font-size:12px;color:var(--t3);text-align:center;padding:20px 0 6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav) + 16px);
       background:var(--ink);color:#fff;padding:9px 16px;border-radius:100px;font-size:12.5px;
       font-weight:600;z-index:var(--zToast);opacity:0;pointer-events:none;transition:opacity .2s;
       max-width:88%;text-align:center;line-height:1.5}
.toast.on{opacity:1}
.spin{display:inline-block;width:13px;height:13px;border:2px solid var(--line2);
      border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>

}

/* 서버 → 이 기기 */
function pullServer(first){
  synSet("확인 중…");
  fetch(API,{cache:"no-store"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(!j||!j.ok||!j.data){ synSet(""); return; }
      var at=+j.updatedAt||0;
      if(at>SYNC.at){
        D=j.data; normalize(); SYNC.at=at; SYNC.base=at; saveLocal(); render();
        synSet("최신","ok");
        if(!first) toast("다른 기기에서 수정한 내용을 불러왔습니다");
      }else{
        SYNC.base=at; synSet("최신","ok");
      }
      if(j.warn==="nokey" && !SYNC.warned){ SYNC.warned=true; }
    })
    .catch(function(){ synSet("오프라인","off"); });
}

/* 이 기기 → 서버 */
function pushServer(force){
  if(SYNC.busy){ SYNC.pend=true; return; }
  SYNC.busy=true; synSet("저장 중…");
  fetch(API,{method:"PUT",headers:{"content-type":"application/json","x-edit-key":SYNC.key},
             body:JSON.stringify({base:SYNC.base,force:!!force,data:D})})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return {s:r.status,j:j}; }); })
    .then(function(o){
      SYNC.busy=false;
      if(o.s===200&&o.j.ok){
        SYNC.at=+o.j.updatedAt||Date.now(); SYNC.base=SYNC.at; saveLocal(); synSet("저장됨","ok");
      }else if(o.s===401){
        synSet("비밀번호 필요","off"); askKey();
      }else if(o.s===409){
        synSet("충돌","off"); resolveConflict(o.j);
      }else{
        synSet("서버 저장 실패","off");
        if(o.j&&o.j.error==="store") toast("서버 저장소가 아직 연결되지 않았습니다");
      }
      if(SYNC.pend){ SYNC.pend=false; pushServer(force); }
    })
    .catch(function(){ SYNC.busy=false; SYNC.pend=false; synSet("오프라인 — 이 기기에만 저장","off"); });
}
function resolveConflict(j){
  if(!j||!j.data){ return; }
  if(confirm("다른 기기에서 먼저 수정했습니다."+"\n\n"+"확인 — 그 내용을 가져옵니다 (지금 내 변경은 사라집니다)"+"\n"+"취소 — 내 내용으로 덮어씁니다")){
    D=j.data; normalize(); SYNC.at=+j.updatedAt||0; SYNC.base=SYNC.at; saveLocal(); render();
    synSet("최신","ok"); toast("서버 내용을 가져왔습니다");
  }else{
    SYNC.base=+j.updatedAt||0; pushServer(true);
  }
}

  if(k===null) return;

function mapQ(nm,ctyId){

function newId(pre){

function hiddenMoveRow(it){ return it && it.k==="move" && !moveIsPlace(it); }
function mv(arrPath,i,dir){
  var a=getPath(arrPath), j=i+dir;
  var dm=/^days\.(\d+)\.items$/.exec(arrPath);
  if(dm){
    var di=+dm[1];
    /* 접어 둔 이동 행은 건너뛴다 — 눌러도 안 움직이는 것처럼 보이지 않게 */
    if(!MVOPEN[di]) while(j>=0 && j<a.length && hiddenMoveRow(a[j])) j+=dir;
    if(j<0||j>=a.length) return;
    var ts=a.map(function(o){ return o.t; });   /* 시각은 자리에 그대로 남긴다 */
    a.splice(j,0,a.splice(i,1)[0]);
    a.forEach(function(o,k){ o.t=ts[k]; });     /* 순서를 바꾸면 시간도 그에 맞춰 바뀜 */
    save(); render(); return;
  }
  if(j<0||j>=a.length) return;
  var t=a[i]; a[i]=a[j]; a[j]=t; save(); render();
}
function del(arrPath,i,msg){

function tmin(s){
  var m=/^(\d{1,2}):(\d{2})/.exec(String(s||"")); if(!m) return 99999;
  var v=(+m[1])*60+(+m[2]); if(v<240) v+=1440;
  return v;
}
function hhmm(v){ v=((Math.round(v)%1440)+1440)%1440; return ("0"+Math.floor(v/60)).slice(-2)+":"+("0"+(v%60)).slice(-2); }
function fmtDur(m){
  m=Math.round(+m||0); if(!m) return "";
  if(m<60) return m+"분";
  var h=Math.floor(m/60), r=m%60;
  return r? h+"시간 "+r+"분" : h+"시간";
}
function distKm(a,b){
  if(!a||!b||!a.la||!b.la) return 0;
  var R=6371, t=Math.PI/180;
  var dLa=(b.la-a.la)*t, dLn=(b.ln-a.ln)*t;
  var s=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.la*t)*Math.cos(b.la*t)*Math.sin(dLn/2)*Math.sin(dLn/2);
  return R*2*Math.atan2(Math.sqrt(s),Math.sqrt(1-s));
}
function estDur(mode,a,b){
  var km=distKm(a,b); if(!km) return 0;
  var M=MODES[mode]||MODES.w;
  return Math.max(1,Math.round(km*(mode==="w"?1.3:1.2)/M.kmh*60));
}

/* ══════════════════ 참조 해석 ══════════════════ */
function pool(k){
  return k==="meal"?D.eats : k==="tour"?D.tours : k==="stay"?D.stays :
         k==="spot"?D.spots : D.spots.concat(D.hubs,D.stays,D.eats);
}
function refRec(it){ return it.ref ? findIn(pool(it.k),it.ref) : null; }
function recName(o){ return o?(o.n||o.nm||""):""; }
/* 교통편(미리 예매한 표)을 참조하는 이동 항목 */
function tripOf(it){ return (it.k==="move"&&it.trip) ? findIn(D.trips,it.trip) : null; }
function place(id){ return findIn(D.hubs,id)||findIn(D.stays,id)||findIn(D.spots,id)||findIn(D.eats,id); }
function tripDest(g){ return g?place(g.to):null; }
function itemMode(it){ var g=tripOf(it); return (g&&g.mode)||it.mode||"w"; }
function itemDur(it){ var g=tripOf(it); return g?(+g.dur||0):(+it.dur||0); }
function itemName(it){
  var g=tripOf(it);
  if(g){ var to=tripDest(g); return g.nm+(to?" → "+recName(to):""); }
  var r=refRec(it);
  if(it.k==="move") return recName(r)||it.x||"";
  if(it.k==="free"||it.k==="wake"||it.k==="sleep") return it.x||"";
  return recName(r)||it.x||"";
}
function itemUrl(it){
  var g=tripOf(it); if(g) return g.u||"";
  if(it.k==="free"||it.k==="wake"||it.k==="sleep") return "";
  var r=refRec(it); if(!r) return "";
  /* 좌표·place_id 로 걸린 지도 링크는 이름 검색으로 바꿉니다 */
  if(r.u && /google\.[^\/]*\/maps/i.test(r.u)) return mapQ(recName(r),r.cty);
  return r.u||"";
}
function itemPt(it){
  var g=tripOf(it);
  if(g){ var to=tripDest(g); return (to&&to.la)?{n:recName(to),la:+to.la,ln:+to.ln}:null; }
  var r=refRec(it); if(!r) return null;
  if(it.k==="tour"){ var sp=r.sp?findIn(D.spots,r.sp):null; return (sp&&sp.la)?{n:r.nm,la:+sp.la,ln:+sp.ln}:null; }
  return r.la?{n:recName(r),la:+r.la,ln:+r.ln}:null;
}
function itemCity(it){
  var g=tripOf(it);
  if(g){ var to=tripDest(g); return (to&&to.cty)?to.cty:""; }
  var r=refRec(it); return (r&&r.cty)?r.cty:"";
}
/* 그 시각에 어느 도시인가 — 앞에서부터 가장 가까운 도시 */
function cityAt(di,pos){
  var d=D.days[di], i;
  for(i=Math.min(pos,d.items.length)-1;i>=0;i--){ var c=itemCity(d.items[i]); if(c) return c; }
  for(i=pos;i<d.items.length;i++){ var c2=itemCity(d.items[i]); if(c2) return c2; }
  if(d.cty&&d.cty[0]) return d.cty[0];
  for(i=di-1;i>=0;i--){ var p=D.days[i]; if(p.items.length){ var c3=cityAt(i,p.items.length); if(c3) return c3; } }
  return (D.cities[0]||{}).id||"";
}
function dayCityList(di){
  var d=D.days[di], out=[];
  d.items.forEach(function(it){ var c=itemCity(it); if(c&&out.indexOf(c)<0) out.push(c); });
  if(!out.length && d.cty) out=d.cty.slice();
  if(!out.length){ var c=cityAt(di,0); if(c) out=[c]; }
  return out;
}
/* 도시를 건너뛰는 수단 — 이건 여정의 축이라 언제나 보여줍니다 */
var FARMODE={f:1,t:1,p:1};
/* 이동이지만 '장소'로 봐야 하는 것
   ① 항공·기차·페리   ② 도착지가 역·공항·터미널 등 거점인 이동
   (도착지가 숙소·식당·관광지면 뒤에 그 항목이 따로 있으므로 이동으로 봅니다) */
function moveIsPlace(it){
  if(!it||it.k!=="move") return false;
  if(FARMODE[itemMode(it)]) return true;
  var g=tripOf(it), to=g?tripDest(g):null;
  var r=to||refRec(it);
  return !!(r && findIn(D.hubs,r.id));
}
/* 이름표 — 예매 교통편은 수단명, 그 밖에는 역·공항 등 장소 종류 */
function movePlaceName(it){
  if(tripOf(it)) return kindName(it);
  var r=refRec(it), h=r?findIn(D.hubs,r.id):null;
  return h?((HUBTP[h.tp]||HUBTP.train).n):kindName(it);
}
function kindName(it){
  if(it.k==="meal") return (MEALS[it.meal||"s"]||MEALS.s).n;
  if(it.k==="move") return (MODES[itemMode(it)]||MODES.w).n;
  return (KINDS[it.k]||KINDS.free).n;
}
function usedIn(id){
  var out=[];
  D.days.forEach(function(d){ d.items.forEach(function(it){ if(it.ref===id && out.indexOf(d.d)<0) out.push(d.d); }); });
  return out.map(function(x){return x+"일"});
}

    list=pool(kind).filter(function(o){return o.cty===cid});
    ph = kind==="meal"?"식당 선택 —" : kind==="tour"?"투어 선택 —" : kind==="stay"?"숙소 선택 —" : "장소 선택 —";
  }
  if(cur && !list.some(function(o){return o.id===cur})){ var r=refRec(it); if(r) list=[r].concat(list); }
  var body;
  if(kind==="move"){
    var by={}; list.forEach(function(o){ (by[o.cty]=by[o.cty]||[]).push(o); });
    var order=[cid].concat(D.cities.map(function(c){return c.id}).filter(function(x){return x!==cid}));
    body=order.map(function(c){
      if(!by[c]||!by[c].length) return "";
      return '<optgroup label="'+at(city(c).nm)+(c===cid?" (지금)":"")+'">'+
        by[c].map(function(o){return '<option value="'+at(o.id)+'"'+(cur===o.id?" selected":"")+'>'+esc(recName(o))+'</option>'}).join("")+'</optgroup>';
    }).join("");
  }else{
    body=list.map(function(o){return '<option value="'+at(o.id)+'"'+(cur===o.id?" selected":"")+'>'+esc(recName(o))+'</option>'}).join("");
  }
  return '<select class="esel2'+(cur?"":" empty")+'" onchange="setRef('+di+','+ii+',this.value)">'+
    '<option value="">'+ph+'</option>'+body+
    ((kind==="meal"||kind==="spot")?'<option value="__new">'+esc(city(cid).nm)+'에서 검색해 추가…</option>':"")+
    '</select>';

function setRef(di,ii,v){
  var it=D.days[di].items[ii];
  if(v==="__new"){
    openSearch(cityAt(di,ii), it.k==="meal"?"eat":"spot", function(id){ it.ref=id; save(); render(); });
    return;
  }
  it.ref=v;
  if(it.k==="move") it.dur=autoDur(di,ii);
  save(); render();
}
function setTrip(di,ii,v){
  var it=D.days[di].items[ii];
  it.trip=v||"";
  if(v){ var g=findIn(D.trips,v); if(g){ it.mode=g.mode; it.ref=""; } }
  save(); render();
}
function autoDur(di,ii){
  var d=D.days[di], it=d.items[ii], to=itemPt(it);
  if(!to) return +it.dur||0;
  var from=null;
  for(var i=ii-1;i>=0;i--){ var p=itemPt(d.items[i]); if(p){ from=p; break; } }
  if(!from) return +it.dur||0;
  return estDur(it.mode||"w",from,to);
}
function setMode(di,ii,v){
  var it=D.days[di].items[ii];
  it.mode=v;
  if((MODES[v]||MODES.w).local){
    var r=refRec(it);
    if(r && r.cty && r.cty!==cityAt(di,ii)) it.ref="";
  }
  it.dur=autoDur(di,ii); save(); render();
}
function tripSelect(di,ii,it){
  var cid=cityAt(di,ii);
  var mine=D.trips.filter(function(g){ var f=place(g.from); return f&&f.cty===cid; });
  var rest=D.trips.filter(function(g){ return mine.indexOf(g)<0; });
  var opt=function(g){ return '<option value="'+at(g.id)+'"'+(it.trip===g.id?" selected":"")+'>'+
      esc(g.dt+" · "+g.nm)+'</option>'; };
  return '<select class="esel" onchange="setTrip('+di+','+ii+',this.value)">'+
    '<option value="">직접 이동 지정</option>'+
    (mine.length?'<optgroup label="'+at(city(cid).nm)+' 출발">'+mine.map(opt).join("")+'</optgroup>':"")+
    (rest.length?'<optgroup label="그 밖">'+rest.map(opt).join("")+'</optgroup>':"")+
    '</select>';
}

function setT(di,ii,v){ D.days[di].items[ii].t=v; save(); }
function sortDay(di){
  var a=D.days[di].items.map(function(it,i){return {it:it,i:i}});
  a.sort(function(x,y){ return (tmin(x.it.t)-tmin(y.it.t))||(x.i-y.i); });
  D.days[di].items=a.map(function(o){return o.it}); save(); render(); toast("시간순으로 정렬했습니다");
}
function resetFixed(di){
  var d=D.days[di], need=[["wake",""],["meal","b"],["meal","l"],["meal","d"],["sleep",""]], n=0;
  need.forEach(function(x){
    if(d.items.some(function(it){ return it.k===x[0] && (x[0]!=="meal"||it.meal===x[1]); })) return;
    var t={wake:"07:30",sleep:"22:30"}[x[0]] || {b:"08:00",l:"13:00",d:"19:00"}[x[1]];
    var o={k:x[0],t:t,x:"",dd:"",ref:""}; if(x[0]==="meal") o.meal=x[1];
    d.items.push(o); n++;
  });
  if(!n){ toast("기상·아침·점심·저녁·취침이 이미 모두 있습니다"); return; }
  sortDay(di); toast(n+"개를 채우고 시간순 정렬했습니다");
}

function guessT(items,pos){
  var p=pos>0?tmin(items[pos-1].t):99999, n=pos<items.length?tmin(items[pos].t):99999, v;
  if(p<99999&&n<99999&&n>p) v=(p+n)/2;
  else if(p<99999) v=p+60;
  else if(n<99999) v=n-60;
  else v=600;
  return hhmm(v);
}
function insItem(di,pos,k,ref,extra){
  var d=D.days[di];
  var it={k:k,t:guessT(d.items,pos),x:"",dd:"",ref:ref||""};
  if(k==="meal") it.meal=extra||"s";
  if(k==="move"){ it.mode=extra||"w"; it.dur=0; }
  if(k==="free") it.x="새 일정";
  d.items.splice(pos,0,it);
  if(k==="move") it.dur=autoDur(di,pos);
  save(); OPENDAY=di; render(); closeSheet(); toast("추가했습니다");
}
function insTrip(di,pos,gid){
  var g=findIn(D.trips,gid); if(!g) return;
  var d=D.days[di];
  d.items.splice(pos,0,{k:"move",trip:gid,mode:g.mode,t:guessT(d.items,pos),x:"",dd:"",ref:""});
  save(); OPENDAY=di; render(); closeSheet(); toast(g.nm+" 넣었습니다");
}

function pickMoveTo(di,pos,mode){

function cardTap(list,id){ if(!EDIT||JUSTDRAGGED) return; openRec(list,id); }

var FORMS={
 stays:[{k:"nm",l:"숙소 이름"},{k:"dt",l:"기간 · 객실"},{k:"ds",l:"설명",t:"area"},
        {k:"cty",l:"도시",t:"city"},{k:"img",l:"이미지 URL"},{k:"u",l:"예약·홈페이지 링크"},

 trips:[{k:"nm",l:"편명 · 이름"},{k:"mode",l:"수단",t:"sel",o:"modes"},{k:"dt",l:"날짜 · 시각"},
        {k:"from",l:"출발",t:"place"},{k:"to",l:"도착",t:"place"},{k:"dur",l:"소요시간(분)",t:"num"},
        {k:"fare",l:"요금"},{k:"bk",l:"예매 완료",t:"chk"},{k:"u",l:"예매 링크"},{k:"d",l:"메모",t:"area"}],
 tours:[{k:"nm",l:"투어 이름"},{k:"dt",l:"날짜 · 시각"},{k:"cty",l:"도시",t:"city"},

        {k:"u",l:"상품 링크"},{k:"rows",l:"내용 (한 줄에 하나 · 항목 | 내용)",t:"rows"}],
 spots:[{k:"n",l:"이름"},{k:"tp",l:"분류",t:"sel",o:"sptp"},{k:"cty",l:"도시",t:"city"},
        {k:"d",l:"메모",t:"area"},{k:"img",l:"사진 URL (비우면 자동으로 찾습니다)"},
        {k:"la",l:"위도",t:"num"},{k:"ln",l:"경도",t:"num"},{k:"u",l:"링크"}],
 eats:[{k:"n",l:"식당 이름"},{k:"g",l:"위치 · 특징"},{k:"f",l:"표시 문구"},{k:"fc",l:"표시 색",t:"sel",o:"flag"},
       {k:"cty",l:"도시",t:"city"},{k:"d",l:"메모",t:"area"},{k:"la",l:"위도",t:"num"},{k:"ln",l:"경도",t:"num"},{k:"u",l:"링크"}],
 hubs:[{k:"n",l:"이름"},{k:"tp",l:"종류",t:"sel",o:"hubtp"},{k:"cty",l:"도시",t:"city"},
       {k:"d",l:"메모",t:"area"},{k:"la",l:"위도",t:"num"},{k:"ln",l:"경도",t:"num"}]
};
function optsFor(o){
  if(o==="modes") return Object.keys(MODES).map(function(k){return [k,MODES[k].n]});
  if(o==="sptp")  return Object.keys(SPTP).map(function(k){return [k,SPTP[k]]});
  if(o==="hubtp") return Object.keys(HUBTP).map(function(k){return [k,HUBTP[k].n]});
  if(o==="flag")  return Object.keys(FLAGC).map(function(k){return [k,FLAGC[k]]});
  return [];
}
function openRec(list,id){
  var o=findIn(D[list],id); if(!o) return;
  var F=FORMS[list]||[];
  var A="'"+list+"','"+at(id)+"'";
  var h='<h3>'+esc(recName(o)||"편집")+'</h3><p class="sm">고치는 즉시 저장됩니다</p>';
  F.forEach(function(f){
    var v=o[f.k], set='onchange="setRec('+A+',\''+f.k+'\',this';
    h+='<label class="fl">'+f.l+'</label>';
    if(f.t==="area") h+='<textarea class="si" '+set+'.value)">'+esc(v||"")+'</textarea>';
    else if(f.t==="num") h+='<input class="si" type="number" step="any" value="'+at(v||"")+'" '+set+'.value,1)">';
    else if(f.t==="chk") h+='<button class="lk" style="width:100%;justify-content:center" onclick="setRec('+A+',\''+f.k+'\','+(v?0:1)+')">'+(v?"예매 완료 — 누르면 해제":"아직 예매 안 함 — 누르면 완료")+'</button>';
    else if(f.t==="city") h+='<select class="si" '+set+'.value)">'+selOpts(D.cities.map(function(c){return [c.id,c.nm]}),v)+'</select>';
    else if(f.t==="spot") h+='<select class="si" '+set+'.value)"><option value="">— 없음</option>'+
        selOpts(D.spots.map(function(x){return [x.id,city(x.cty).nm+" · "+x.n]}),v||"")+'</select>';
    else if(f.t==="place") h+='<select class="si" '+set+'.value)"><option value="">— 없음</option>'+
        selOpts(D.hubs.concat(D.stays,D.spots).map(function(x){return [x.id,city(x.cty).nm+" · "+recName(x)]}),v||"")+'</select>';
    else if(f.t==="sel") h+='<select class="si" '+set+'.value)">'+selOpts(optsFor(f.o),v)+'</select>';
    else if(f.t==="rows") h+='<textarea class="si" style="min-height:120px" onchange="setRows('+A+',this.value)">'+
        esc((v||[]).map(function(r){return r[0]+" | "+r[1]}).join("\n"))+'</textarea>';
    else h+='<input class="si" value="'+at(v||"")+'" '+set+'.value)">';
  });
  var used=usedIn(id);
  if(used.length) h+='<p class="hint">일정에 쓰이는 중 — '+used.join(", ")+'</p>';
  h+='<button class="lk" style="width:100%;justify-content:center;color:var(--red);margin-top:16px" '+
     'onclick="delRec('+A+')">이 항목 삭제</button>';
  openSheet(h);
}
function setRec(list,id,k,v,num){
  var o=findIn(D[list],id); if(!o) return;
  o[k]=num?(parseFloat(v)||0):v;
  save(); render();
  if(k==="bk"||k==="mode"||k==="tp"||k==="fc"||k==="cty") openRec(list,id);
}
function setRows(list,id,txt){
  var o=findIn(D[list],id); if(!o) return;
  o.rows=String(txt||"").split("\n").filter(function(l){return l.trim()}).map(function(l){
    var i=l.indexOf("|");
    return i<0?[l.trim(),""]:[l.slice(0,i).trim(),l.slice(i+1).trim()];
  });
  save(); render();
}
function delRec(list,id){
  var o=findIn(D[list],id); if(!o) return;
  if(!confirm(recName(o)+" 을(를) 삭제할까요?")) return;
  D[list].splice(D[list].indexOf(o),1); save(); render(); closeSheet(); toast("삭제했습니다");
}

/* ══════════════════ 검색 (OpenStreetMap Nominatim) ══════════════════ */
function openSearch(cty,type,cb){
  SCB=cb||null; SRES=[];
  openSheet(searchHtml(cty||((D.cities[0]||{}).id||""),type));
  setTimeout(function(){ var e=document.getElementById("sq"); if(e) e.focus(); },60);
}
function searchHtml(cty,type){
  var t=(type==="eat")?"식당":(type==="hub")?"역 · 공항":"관광지";
  var ph=(type==="eat")?"예: Trattoria Mario":(type==="hub")?"예: Napoli Centrale":"예: 콜로세움 · Colosseo";
  return '<h3>'+t+' 검색</h3>'+
   '<p class="sm">찾은 곳은 좌표까지 함께 저장돼 일정·지도에 바로 쓰입니다</p>'+
   '<input type="hidden" id="stype" value="'+at(type)+'">'+
   '<label class="fl">도시</label><select class="si" id="scty">'+selOpts(D.cities.map(function(c){return [c.id,c.nm]}),cty)+'</select>'+
   '<label class="fl">검색어</label>'+
   '<div class="srow"><input class="si" id="sq" placeholder="'+at(ph)+
     '" onkeydown="if(event.key===&#39;Enter&#39;){event.preventDefault();doSearch()}">'+
     '<button class="lk f" onclick="doSearch()">검색</button></div>'+
   '<div id="sres"></div>'+
   '<h4>직접 입력</h4>'+
   '<input class="si" id="mn" placeholder="이름">'+
   '<div class="srow" style="margin-top:6px"><input class="si" id="mla" placeholder="위도 (선택)"><input class="si" id="mln" placeholder="경도 (선택)"></div>'+
   '<button class="lk" style="width:100%;justify-content:center;margin-top:8px" onclick="addManual()">직접 추가</button>'+
   '<p class="hint">무료 공개 서비스(OpenStreetMap Nominatim)를 씁니다. 연속으로 누르지 말고 1초쯤 간격을 두세요.<br>결과가 없으면 현지어 이름(Colosseo, Duomo)으로 다시 시도해 보세요.</p>';
}
function doSearch(){
  var q=(document.getElementById("sq").value||"").trim();
  var cty=document.getElementById("scty").value, type=document.getElementById("stype").value;
  var box=document.getElementById("sres");
  if(!q){ box.innerHTML='<p class="hint">검색어를 입력하세요.</p>'; return; }
  var c=city(cty), full=q+(c.en?(", "+c.en):"")+", Italia";
  box.innerHTML='<p class="hint"><span class="spin"></span> &nbsp;<b>'+esc(full)+'</b> 검색 중…</p>';
  var url="https://nominatim.openstreetmap.org/search?format=jsonv2&limit=8&addressdetails=1&accept-language=ko,en&q="+encodeURIComponent(full);
  fetch(url,{headers:{"Accept":"application/json"}})
    .then(function(r){ if(!r.ok) throw 0; return r.json(); })
    .then(function(js){
      SRES=js||[];
      if(!SRES.length){ box.innerHTML='<p class="hint">결과가 없습니다. 현지어 이름으로 다시 시도하거나 아래에서 직접 입력하세요.</p>'; return; }
      box.innerHTML='<h4>검색 결과 '+SRES.length+'건</h4>'+SRES.map(function(r,i){
        var nm=(r.name||String(r.display_name||"").split(",")[0]||"").trim();
        var ad=String(r.display_name||"").split(",").slice(1,4).join(",").trim();
        return pk(esc(nm), esc(ad)+" · "+esc(r.type||""), "takeRes("+i+")");
      }).join("");
    })
    .catch(function(){
      box.innerHTML='<p class="hint">검색에 실패했습니다. 인터넷 연결을 확인하거나(오프라인·차단 환경) 아래에서 직접 입력해 주세요.</p>';
    });
}
function hubType(r){
  var t=String((r&&r.type)||"")+" "+String((r&&r.category)||"")+" "+String((r&&r.class)||"");
  if(/aero|airport|aerodrome/i.test(t)) return "air";
  if(/subway|metro/i.test(t)) return "metro";
  if(/bus|coach/i.test(t)) return "bus";
  if(/ferry|harbour|port/i.test(t)) return "port";
  if(/aerialway|cable|gondola/i.test(t)) return "cable";
  return "train";
}
function addRec(type,cty,n,d,la,ln,u,raw){
  var id;
  if(type==="eat"){ id=newId("e");
    D.eats.push({id:id,cty:cty,n:n,g:d||"",f:"검색 추가",fc:"b",d:"",la:la||0,ln:ln||0,u:u||""});
  }else if(type==="hub"){ id=newId("u");
    D.hubs.push({id:id,cty:cty,tp:hubType(raw),n:n,d:d||"",la:la||0,ln:ln||0});
  }else{ id=newId("sp");
    D.spots.push({id:id,cty:cty,tp:"sg",n:n,d:d||"",la:la||0,ln:ln||0,u:u||""});
  }
  save(); return id;
}
function takeRes(i){
  var r=SRES[i]; if(!r) return;
  var type=document.getElementById("stype").value, cty=document.getElementById("scty").value;
  var nm=(r.name||String(r.display_name||"").split(",")[0]||"").trim();
  var ad=String(r.display_name||"").split(",").slice(1,4).join(",").trim();
  var la=parseFloat(r.lat), ln=parseFloat(r.lon);
  finishAdd(addRec(type,cty,nm,ad,la,ln,"",r),nm);
}
function addManual(){
  var n=(document.getElementById("mn").value||"").trim();
  if(!n){ toast("이름을 입력하세요"); return; }
  var type=document.getElementById("stype").value, cty=document.getElementById("scty").value;
  var la=parseFloat(document.getElementById("mla").value)||0, ln=parseFloat(document.getElementById("mln").value)||0;
  finishAdd(addRec(type,cty,n,"",la,ln,"",null),n);
}
function finishAdd(id,nm){
  var cb=SCB; SCB=null;
  if(cb){ cb(id); }
  else{ render(); closeSheet(); toast(esc(nm)+" 담았습니다"); }
}

/* ═════════════ 사진 (위키백과 자동 조회 · 캐시) ═════════════ */
var IMG={}; try{ IMG=JSON.parse(localStorage.getItem("wt_img")||"{}"); }catch(e){ IMG={}; }
function imgSave(){ try{ localStorage.setItem("wt_img",JSON.stringify(IMG)); }catch(e){} }

/* 사진을 붙일 항목인가 — 관광지 · 투어 */
function photoOf(it){
  if(!it||(it.k!=="spot"&&it.k!=="tour")) return null;
  var r=refRec(it); if(!r) return null;
  if(it.k==="tour"){
    /* 투어에 '지도 지점'이 연결돼 있으면 그 관광지의 사진·갤러리를 그대로 씁니다 */
    var sp=r.sp?findIn(D.spots,r.sp):null;
    if(sp && !r.img) return {id:sp.id,img:sp.img||""};
    return {id:r.id,img:r.img||""};
  }
  return {id:r.id,img:r.img||""};
}
function thumbHtml(it){
  var ph=photoOf(it); if(!ph) return "";
  var u=ph.img||IMG[ph.id]||"";
  var none=(!u && IMG[ph.id]==="");
  return '<span class="thb'+(none?" no":"")+'" data-pid="'+at(ph.id)+'" title="사진 더 보기" '+
    'onclick="event.stopPropagation();openGallery(\''+at(ph.id)+'\')">'+
    (u?'<img src="'+at(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="thbFail(this)">':"")+'</span>';
}
function thbFail(im){
  var b=im.parentNode; if(!b) return;
  b.innerHTML=""; b.classList.add("no");
}
function applyPhoto(id,u){
  document.querySelectorAll('.thb[data-pid="'+id+'"]').forEach(function(b){
    if(u){ b.classList.remove("no");
      b.innerHTML='<img src="'+at(u)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="thbFail(this)">';
    }else{ b.innerHTML=""; b.classList.add("no"); }
  });
}
function wikiUrl(lang,gen){
  return "https://"+lang+".wikipedia.org/w/api.php?action=query&format=json&origin=*"+
         "&prop=pageimages%7Ccoordinates&piprop=thumbnail&pithumbsize=480&colimit=50&"+gen;
}
/* 좌표를 아는 곳이면, 3km 안에 있는 문서의 사진만 씁니다 (엉뚱한 사진 방지) */
function pickThumb(js,la,ln){
  var pg=js&&js.query&&js.query.pages; if(!pg) return "";
  var list=Object.keys(pg).map(function(k){return pg[k]})
             .sort(function(a,b){ return (a.index||0)-(b.index||0); });
  for(var i=0;i<list.length;i++){
    var p=list[i];
    if(!p||!p.thumbnail||!p.thumbnail.source) continue;
    if(la){
      var c=p.coordinates&&p.coordinates[0]; if(!c) continue;
      if(distKm({la:la,ln:ln},{la:c.lat,ln:c.lon})>3) continue;
    }
    return p.thumbnail.source;
  }
  return "";
}
function lookupPhoto(id,done){
  var r=findIn(D.spots,id)||findIn(D.tours,id);
  if(!r){ IMG[id]=""; imgSave(); applyPhoto(id,""); return done(); }
  var nm=recName(r), la=+r.la||0, ln=+r.ln||0;
  if(r.sp){ var sp=findIn(D.spots,r.sp); if(sp){ la=+sp.la||0; ln=+sp.ln||0; } }
  var q=[];
  if(nm) q.push(wikiUrl("ko","generator=search&gsrsearch="+encodeURIComponent(nm.normalize?nm.normalize("NFC"):nm)+"&gsrlimit=3"));
  if(la){ q.push(wikiUrl("en","generator=geosearch&ggscoord="+la+"%7C"+ln+"&ggsradius=500&ggslimit=6"));
          q.push(wikiUrl("it","generator=geosearch&ggscoord="+la+"%7C"+ln+"&ggsradius=500&ggslimit=6")); }
  step(0);
  function step(i){
    if(i>=q.length){ IMG[id]=""; imgSave(); applyPhoto(id,""); return done(); }
    fetch(q[i]).then(function(x){ return x.json(); }).then(function(js){
      var u=pickThumb(js,la,ln);
      if(u){ IMG[id]=u; imgSave(); applyPhoto(id,u); return done(); }
      step(i+1);
    }).catch(function(){ step(i+1); });
  }
}
/* ── 사진 갤러리 : 위키미디어 공용에서 그 자리의 사진들을 모아 봅니다 ── */
var GAL={}, GV={list:[],i:0,nm:""};
function galRec(id){ return findIn(D.spots,id)||findIn(D.tours,id); }
function galPt(r){
  var la=+r.la||0, ln=+r.ln||0;
  if(r.sp){ var sp=findIn(D.spots,r.sp); if(sp){ la=+sp.la||0; ln=+sp.ln||0; } }
  return {la:la,ln:ln};
}
function commonsUrl(gen){
  return "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*"+
         "&prop=imageinfo&iiprop=url%7Cmime&iiurlwidth=900&"+gen;
}
function commonsGeoUrl(la,ln,rad){
  return commonsUrl("generator=geosearch&ggsnamespace=6&ggscoord="+la+"%7C"+ln+
                    "&ggsradius="+rad+"&ggslimit=24");
}
function commonsSearchUrl(nm){
  return commonsUrl("generator=search&gsrnamespace=6&gsrlimit=24&gsrsearch="+
                    encodeURIComponent(nm.normalize?nm.normalize("NFC"):nm));
}
function commonsPick(js){
  var pg=js&&js.query&&js.query.pages; if(!pg) return [];
  return Object.keys(pg).map(function(k){ return pg[k]; })
    .sort(function(a,b){ return (a.index||0)-(b.index||0); })
    .filter(function(p){
      var ii=p&&p.imageinfo&&p.imageinfo[0];
      return !!(ii&&ii.thumburl&&(!ii.mime||/^image\/(jpeg|png|webp)$/.test(ii.mime)));
    })
    .map(function(p){
      var ii=p.imageinfo[0];
      return {u:ii.thumburl,pg:ii.descriptionurl||""};
    });
}
function openGallery(id){
  var r=galRec(id); if(!r) return;
  GV={list:[],i:0,nm:recName(r)};
  if(GAL[id]){ GV.list=GAL[id]; drawGallery(); return; }
  openSheet('<h3>'+esc(recName(r))+'</h3>'+
    '<p class="sm"><span class="spin"></span> &nbsp;사진을 모으는 중…</p>');
  loadGallery(id,r);
}
function loadGallery(id,r){
  var p=galPt(r), nm=recName(r), out=[], seen={};
  var lead=r.img||IMG[id]||"";
  if(lead){ out.push({u:lead,pg:""}); seen[lead]=1; }
  var q=[];
  if(p.la){ q.push(commonsGeoUrl(p.la,p.ln,300)); q.push(commonsGeoUrl(p.la,p.ln,900)); }
  if(nm) q.push(commonsSearchUrl(nm));
  step(0);
  function step(i){
    if(i>=q.length){ finish(); return; }
    fetch(q[i]).then(function(x){ return x.json(); }).then(function(js){
      commonsPick(js).forEach(function(o){
        if(!seen[o.u] && out.length<24){ seen[o.u]=1; out.push(o); }
      });
      if(out.length>=8){ finish(); return; }
      step(i+1);
    }).catch(function(){ step(i+1); });
  }
  function finish(){ GAL[id]=out; GV.list=out; GV.i=0; drawGallery(); }
}
function drawGallery(){
  var L=GV.list;
  if(!L.length){
    openSheet('<h3>'+esc(GV.nm)+'</h3><p class="sm">이곳의 사진을 찾지 못했습니다.</p>');
    return;
  }
  var c=L[0];
  openSheet('<h3>'+esc(GV.nm)+'</h3>'+
    '<div class="galbig"><img id="galimg" src="'+at(c.u)+'" alt="" referrerpolicy="no-referrer">'+
      (L.length>1?'<button class="galnav p" onclick="galGo(-1)">‹</button>'+
                  '<button class="galnav n" onclick="galGo(1)">›</button>':"")+
      '<span class="galcnt" id="galcnt">1 / '+L.length+'</span></div>'+
    '<div class="galstrip">'+L.map(function(o,i){
      return '<button class="'+(i===0?"on":"")+'" onclick="galSet('+i+')">'+
             '<img src="'+at(o.u)+'" alt="" loading="lazy" referrerpolicy="no-referrer"></button>';
    }).join("")+'</div>'+
    '<p class="hint"><a class="lk sm" id="galsrc" href="'+at(c.pg||"#")+'" target="_blank" rel="noopener"'+
      (c.pg?"":' style="display:none"')+'>이 사진 원본 · 저작자 보기</a><br>사진 출처 — Wikimedia Commons</p>');
}
function galSet(i){
  var L=GV.list; if(!L[i]) return;
  GV.i=i;
  var big=document.getElementById("galimg"); if(!big){ drawGallery(); return; }
  big.src=L[i].u;
  var cnt=document.getElementById("galcnt"); if(cnt) cnt.textContent=(i+1)+" / "+L.length;
  var lk=document.getElementById("galsrc");
  if(lk){ lk.href=L[i].pg||"#"; lk.style.display=L[i].pg?"":"none"; }
  document.querySelectorAll(".galstrip button").forEach(function(b,j){ b.className=(j===i?"on":""); });
}
function galGo(d){
  var n=GV.list.length; if(!n) return;
  galSet((GV.i+d+n)%n);
}

var PQ=[], PBUSY=false;
function pNext(){
  if(PBUSY||!PQ.length) return;
  PBUSY=true;
  lookupPhoto(PQ.shift(),function(){ PBUSY=false; setTimeout(pNext,220); });
}
function fillPhotos(){
  document.querySelectorAll(".thb[data-pid]").forEach(function(b){
    var id=b.dataset.pid;
    if(b.firstChild) return;
    if(IMG.hasOwnProperty(id)){
      if(IMG[id]) applyPhoto(id,IMG[id]); else b.classList.add("no");
      return;
    }
    if(PQ.indexOf(id)<0) PQ.push(id);
  });
  pNext();
}

/* ═════════════════ 지도 ═════════════════ */
var MVOPEN={};   /* 날짜별 — 이동 항목을 펼쳐 두었는지 */
/* 하루의 지도 지점 — 도시까지 붙여서 */
function dayPts(di){
  var day=D.days[di], out=[]; if(!day) return out;
  day.items.forEach(function(it){
    var p=itemPt(it); if(!p||!p.la) return;
    var last=out[out.length-1];
    if(last && last.la===p.la && last.ln===p.ln){ if(it.k!=="move") last.n=p.n; return; }
    out.push({n:p.n||itemName(it)||kindName(it),la:p.la,ln:p.ln,
              m:(it.k==="move"?itemMode(it):""),c:itemCity(it)||""});
  });
  var c="";
  out.forEach(function(p){ if(p.c) c=p.c; else p.c=c; });
  c="";
  for(var i=out.length-1;i>=0;i--){ if(out[i].c) c=out[i].c; else out[i].c=c; }
  return out;
}
/* 그날 지도를 만들 도시 목록 (등장 순서) */
function dayMapCities(di){
  var out=[], ps=dayPts(di);
  if(!ps.length) return out;
  ps.forEach(function(p){ if(p.c && out.indexOf(p.c)<0) out.push(p.c); });
  return out.length?out:[""];
}
/* 도시마다 버튼 하나 + 지도 하나 */
function mapBlock(di){
  var cs=dayMapCities(di), many=cs.length>1;
  var btn=cs.map(function(cid){
    var nm=(many&&cid)?city(cid).nm:"지도";
    return '<button class="mapt" onclick="toggleMap(this)">'+
      '<span class="cv">›</span><span class="tt">'+esc(nm)+'</span></button>';
  }).join("");
  var wrap=cs.map(function(cid){
    return '<div class="mapw" hidden><div class="map" data-m="'+di+'" data-c="'+at(cid)+'"></div></div>';
  }).join("");
  /* 오른쪽 끝 — 이동 항목 펼치기 */
  var d=D.days[di], hasMv=!!(d&&d.items&&d.items.some(function(it){
    return it.k==="move" && !moveIsPlace(it);
  }));
  var mvb=hasMv?('<button class="mapt mvt'+(MVOPEN[di]?" on":"")+'" onclick="toggleMoves(this,'+di+')">'+
    '<span class="cv">›</span><span class="tt">이동</span></button>'):"";
  if(!btn && !mvb) return "";
  return '<div class="mapbox"><div class="maptr">'+btn+mvb+'</div>'+wrap+'</div>';
}
/* 이동 항목 펼치기 */
function toggleMoves(btn,di){
  var body=btn.closest(".dbody"); if(!body) return;
  var ul=body.querySelector("ul.tl"); if(!ul) return;
  var on=!ul.classList.toggle("nomv");
  MVOPEN[di]=on;
  btn.classList.toggle("on",on);
}
function buildMap(el){
  if(el.dataset.done) return true;
  if(typeof L==="undefined") return false;
  var di=+el.dataset.m, cty=el.dataset.c||"";
  if(!D.days[di]) return false;
  var all=dayPts(di), total=all.length, pts=[];
  all.forEach(function(p,i){ p.i=i; if(!cty||p.c===cty) pts.push(p); });
  if(pts.length<1) return false;
  el.dataset.done="1";
  var map=L.map(el,{scrollWheelZoom:false});
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {subdomains:"abcd",maxZoom:20,detectRetina:true,
     attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
  var ll=pts.map(function(p){return [p.la,p.ln]});
  for(var i=1;i<pts.length;i++){
    var md=pts[i].m, M=MODES[md], w=(!md||md==="w");
    L.polyline([ll[i-1],ll[i]],{color:M?M.c:"#8E8D89",weight:w?3:4.5,opacity:.92,
      dashArray:w?"2,7":null,lineCap:"round"}).addTo(map)
      .bindPopup("<b>"+(pts[i-1].i+1)+" &rarr; "+(pts[i].i+1)+"</b><br>"+esc(pts[i-1].n)+" &rarr; "+esc(pts[i].n)+(M?"<br>"+M.n:""));
  }
  pts.forEach(function(p){
    var bg=p.i===0?"#3D7A55":(p.i===total-1?"#B34A42":"#2F6FA8");
    L.marker([p.la,p.ln],{zIndexOffset:100,icon:L.divIcon({className:"",iconSize:[22,22],iconAnchor:[11,11],
      html:'<div class="mnum" style="background:'+bg+'">'+(p.i+1)+'</div>'})}).addTo(map)
      .bindTooltip('<b>'+(p.i+1)+'</b> '+esc(p.n),{permanent:true,direction:"right",offset:[12,0],className:"mlbl"})
      .bindPopup("<b>"+(p.i+1)+". "+esc(p.n)+"</b>");
  });
  var s=document.createElement("div"); s.className="rs";
  s.innerHTML=pts.map(function(p){
    var c=p.i===0?"s":(p.i===total-1?"e":"");
    return '<span class="ri"><span class="pn '+c+'">'+(p.i+1)+'</span>'+esc(p.n)+'</span>';
  }).join('<span class="ar">&rsaquo;</span>');
  el.parentNode.appendChild(s);
  if(pts.length>1) map.fitBounds(L.latLngBounds(ll).pad(0.25));
  else map.setView(ll[0],14);
  setTimeout(function(){map.invalidateSize()},150);
  el._map=map;
  return true;
}

/* 지도 펼치기 — 한 번에 하나만 */
function toggleMap(btn){
  var box=btn.closest(".mapbox"); if(!box) return;
  var idx=[].indexOf.call(btn.parentNode.children,btn);
  var ws=box.querySelectorAll(".mapw"), w=ws[idx]; if(!w) return;
  var el=w.querySelector(".map");
  var open=w.hasAttribute("hidden");
  /* 같은 날짜의 다른 지도는 모두 접기 */
  [].forEach.call(ws,function(o,i){
    if(i===idx) return;
    o.setAttribute("hidden","");
    var b=btn.parentNode.children[i]; if(b) b.classList.remove("on");
  });
  if(open){
    w.removeAttribute("hidden");
    if(!buildMap(el)){
      w.setAttribute("hidden","");
      toast("표시할 장소가 없습니다");
      return;
    }
    if(el._map) setTimeout(function(){ el._map.invalidateSize(); },30);
    btn.classList.add("on");
  }else{
    w.setAttribute("hidden","");
    btn.classList.remove("on");
  }
}

/* ══════════════════ 꾹 눌러 순서 변경 ══════════════════ */
var DRAG=null, JUSTDRAGGED=false;
function bindDrag(){
  document.querySelectorAll("[data-drag]").forEach(function(el){
    if(el._dg) return; el._dg=1;
    el.addEventListener("pointerdown",dgDown);
  });
}
function dgDown(e){
  if(!EDIT) return;
  if(e.target && e.target.closest && e.target.closest("a,button,input,select,textarea")) return;
  var el=e.currentTarget, sx=e.clientX, sy=e.clientY;
  var timer=setTimeout(function(){ clean(); dgStart(el); },420);
  function mv(ev){ if(Math.abs(ev.clientX-sx)>10||Math.abs(ev.clientY-sy)>10) clean(); }
  function clean(){
    clearTimeout(timer);
    document.removeEventListener("pointermove",mv);
    document.removeEventListener("pointerup",clean);
    document.removeEventListener("pointercancel",clean);
  }
  document.addEventListener("pointermove",mv);
  document.addEventListener("pointerup",clean);
  document.addEventListener("pointercancel",clean);
}
function dgStart(el){
  DRAG={el:el,cont:el.parentNode,list:el.dataset.drag};
  document.body.classList.add("dragging");
  el.classList.add("dg");
  if(navigator.vibrate){ try{ navigator.vibrate(25); }catch(e){} }
  document.addEventListener("pointermove",dgMove,{passive:false});
  document.addEventListener("pointerup",dgEnd);
  document.addEventListener("pointercancel",dgEnd);
  document.addEventListener("touchmove",dgBlock,{passive:false});
  toast("누른 채로 위아래로 옮기세요");
}
function dgBlock(e){ if(DRAG) e.preventDefault(); }
function dgMove(e){
  if(!DRAG) return;
  e.preventDefault();
  var el=DRAG.el, cont=DRAG.cont, x=e.clientX, y=e.clientY;
  var sibs=[].filter.call(cont.children,function(ch){ return ch!==el && ch.dataset && ch.dataset.drag; });
  if(!sibs.length) return;
  var best=null, bd=Infinity;
  sibs.forEach(function(s){
    var r=s.getBoundingClientRect(), cx=(r.left+r.right)/2, cy=(r.top+r.bottom)/2;
    var d=(x-cx)*(x-cx)+(y-cy)*(y-cy);
    if(d<bd){ bd=d; best=s; }
  });
  var r=best.getBoundingClientRect();
  var oneCol=true;
  if(sibs.length>1){
    var a=sibs[0].getBoundingClientRect(), b=sibs[1].getBoundingClientRect();
    oneCol=Math.abs(a.top-b.top)>4;
  }
  var after = oneCol ? (y>(r.top+r.bottom)/2)
                     : (y>r.bottom || (y>r.top && x>(r.left+r.right)/2));
  if(after) cont.insertBefore(el,best.nextSibling); else cont.insertBefore(el,best);
}
function dgEnd(){
  if(!DRAG) return;
  var cont=DRAG.cont, list=DRAG.list, el=DRAG.el;
  el.classList.remove("dg");
  document.body.classList.remove("dragging");
  document.removeEventListener("pointermove",dgMove);
  document.removeEventListener("pointerup",dgEnd);
  document.removeEventListener("pointercancel",dgEnd);
  document.removeEventListener("touchmove",dgBlock);
  var ids=[].filter.call(cont.children,function(ch){ return ch.dataset && ch.dataset.drag; })
             .map(function(ch){ return ch.dataset.id; });
  DRAG=null;
  JUSTDRAGGED=true; setTimeout(function(){ JUSTDRAGGED=false; },400);
  reorderIn(list,ids);
  render(); toast("순서를 저장했습니다");
}
function reorderIn(listName,ids){
  var arr=D[listName]; if(!arr) return;
  var idx=[]; arr.forEach(function(o,i){ if(ids.indexOf(o.id)>=0) idx.push(i); });
  var recs=ids.map(function(id){ return findIn(arr,id); }).filter(Boolean);
  if(idx.length!==recs.length) return;
  idx.forEach(function(pos,k){ arr[pos]=recs[k]; });
  save();
}

/* ══════════════════ 바인딩 ══════════════════ */
function bindEditable(){
  document.querySelectorAll("[data-k]").forEach(function(el){
    if(el.dataset.bound) return;
    el.dataset.bound="1";
    el.addEventListener("blur",function(){ setPath(el.dataset.k, el.innerHTML); });
    el.addEventListener("keydown",function(e){
      if(e.key==="Enter" && !el.dataset.blk){ e.preventDefault(); el.blur(); }
    });
    el.addEventListener("click",function(e){ e.stopPropagation(); });
  });
}
function scrollDayToTop(d){
  requestAnimationFrame(function(){
    var tb=document.querySelector(".top");
    var h=tb?tb.getBoundingClientRect().height:0;
    var y=window.pageYOffset+d.getBoundingClientRect().top-h-8;
    if(y<0) y=0;
    try{ window.scrollTo({top:y,behavior:"smooth"}); }
    catch(e){ window.scrollTo(0,y); }
  });
}
function bindDays(){
  var ds=document.querySelectorAll("details.day");
  ds.forEach(function(d){
    d.addEventListener("toggle",function(){
      var di=+d.dataset.di;
      if(d.open){
        OPENDAY=di;
        ds.forEach(function(o){ if(o!==d) o.open=false; });
        /* 열린 카드를 상단(고정 헤더 바로 아래)으로 올림 */
        scrollDayToTop(d);
      }else if(OPENDAY===di) OPENDAY=-1;
    });
  });
}

function openSheet(html){
  document.getElementById("sb").innerHTML=html;
  document.getElementById("mask").classList.add("on");
  document.body.style.overflow="hidden";
  var s=document.querySelector(".sheet"); if(s) s.scrollTop=0;

function closeSheet(){
  SCB=null;

}
function exportJSON(){
  var blob=new Blob([JSON.stringify(D,null,2)],{type:"application/json"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="italy-trip-"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
  toast("JSON 파일을 내려받았습니다");
}
function importJSON(inp){
  var f=inp.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{ D=JSON.parse(r.result); normalize(); save(); render(); closeSheet(); toast("불러왔습니다"); }
    catch(e){ alert("JSON 형식이 아닙니다."); }
  };
  r.readAsText(f);
}
function resetAll(){
  if(!confirm("이 기기에서 고친 내용을 버리고 서버의 최신본으로 되돌릴까요?")) return;
  SYNC.at=0; SYNC.base=0; closeSheet();
  var fallback=function(msg){
    D=JSON.parse(JSON.stringify(DEFAULT)); normalize(); saveLocal(); render(); toast(msg);
  };
  fetch(API,{cache:"no-store"})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(j){
      if(j&&j.ok&&j.data){
        D=j.data; normalize(); SYNC.at=+j.updatedAt||0; SYNC.base=SYNC.at;
        saveLocal(); render(); toast("서버 최신본으로 되돌렸습니다");
      }else fallback("기본 일정으로 되돌렸습니다");
    })
    .catch(function(){ fallback("서버에 연결하지 못해 기본 일정으로 되돌렸습니다"); });
}
